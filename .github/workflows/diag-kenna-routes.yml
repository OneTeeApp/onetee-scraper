name: Kenna discovery routes + booking host shape

# Follow-ups from diag_golden_hills.txt: (1) does the book.teeitup.com host
# follow the alias, which decides whether the Golden Hills booking_url we
# publish is broken for users too, and (2) is /v2/courses 404 fleet-wide — the
# control alias 404'd there while every alias that resolved did so on
# /alias/<alias>/facilities, which discover_facilities only tries second.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/diag_kenna_routes.py"
      - ".github/workflows/diag-kenna-routes.yml"

permissions:
  contents: write

concurrency:
  group: diag-kenna-routes
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt || pip install requests beautifulsoup4 lxml

      - name: Diagnose
        run: |
          mkdir -p probe-results
          python scripts/diag_kenna_routes.py 2>&1 | tee probe-results/diag_kenna_routes.txt

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results/diag_kenna_routes.txt
          git commit -m "kenna route + booking host diagnosis [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "could not push kenna route diag results after 5 attempts"; exit 1
