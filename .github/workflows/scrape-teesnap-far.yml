name: Scrape Teesnap far (days 6-30, plain HTTP direct, low concurrency)

# Far companion to scrape-teesnap.yml. Same transport: teesnap is reachable by PLAIN
# HTTP from the free datacenter runner (probe-teesnap-methods.yml run 31362465248 —
# 8/8 subs HTTP 200, no proxy, no curl_cffi; the rotating DC proxy was WORSE, 403 on
# 2 subs). Teesnap resets under bursty concurrency, so this stays LOW-concurrency
# (workers 4) and isolated from the 10-worker shared tiers.
#
# OWNERSHIP. scrape-teesnap.yml owns days 0-6; this owns days 6-30. Teesnap is
# EXCLUDED from scrape-near.yml / scrape.yml / scrape-far.yml. Plain HTTP, no proxy.

# 2026-09-01: moved to the self-hosted runner on the scraper VPS (label
# "scraper"). Same job, your hardware: no 20-slot concurrency cap, no queueing
# behind the near-tier loops, and Chromium/xvfb come preinstalled by
# vps/scraper-host/bootstrap.sh instead of apt-under-sudo per run.
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper/adapters/teesnap.py"
      - ".github/workflows/scrape-teesnap-far.yml"

permissions:
  contents: read

concurrency:
  group: scrape-teesnap-far
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: [self-hosted, linux, scraper]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests      # plain HTTP only — no proxy, no Chromium

      - name: Scrape far teesnap (plain HTTP, low concurrency) + push each date to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          VPS_ONLY: "1"
          ONETEE_API_URL: https://api.oneteeapp.com
          ONETEE_INGEST_TOKEN: ${{ secrets.VPS_INGEST_TOKEN }}
        run: |
          for DATE in $(python -m scraper.dates --registry registry.json --start 6 --days 24 | shuf); do
            OUT="output/tsf_${DATE}.json"
            echo "::group::teesnap far ${DATE}"
            python -m scraper.aggregate --date "${DATE}" --workers 1 \
              --platforms teesnap --out "${OUT}" || true
            python -m scraper.d1 push --data "${OUT}" || true
            echo "::endgroup::"
          done
