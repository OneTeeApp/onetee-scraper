name: Scrape Chronogolf via browser (0-6 hourly, 0-30 every 8h)

# 2026-11-11. Chronogolf's tee-times endpoint started answering Python
# `requests` with a Cloudflare 403 (~29 Sep); discovery still answered, so every
# course errored and the platform went dark. This job loads each club's public
# booking widget in a real, unmodified Chromium (headful under xvfb) and reads
# the tee sheet the widget itself requests. See scraper/browser_chronogolf.py
# and claude/chronogolf-browser-2026-11-11.md.
#
# OWNERSHIP. scrape.yml, scrape-near.yml and scrape-far.yml --exclude
# chronogolf, so this job solely owns those slugs in D1.
#
# BRANCH RUNS ARE READ-ONLY. A push to any branch touching these files runs the
# scrape so a change can be checked on a real runner, but only main writes to
# D1 (the push step is gated on refs/heads/main).

on:
  schedule:
    # SHALLOW, days 0-6, hourly except the three deep slots.
    - cron: "41 0,1,3,4,5,6,7,8,9,11,12,13,14,15,16,17,19,20,21,22,23 * * *"
    # DEEP, days 0-30, three slots 8h apart (matched by exact string below —
    # github.event.schedule, not the wall clock; see scrape-clubcaddie-browser).
    - cron: "41 2 * * *"
    - cron: "41 10 * * *"
    - cron: "41 18 * * *"
  workflow_dispatch:
    inputs:
      deep:
        description: "Scrape the full 0-30 day horizon"
        default: "no"
  push:
    paths:
      - "scraper/browser_chronogolf.py"
      - "scraper/adapters/chronogolf.py"
      - ".github/workflows/scrape-chronogolf-browser.yml"

permissions:
  contents: read

concurrency:
  group: scrape-chronogolf-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium + xvfb
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
          command -v xvfb-run >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }

      - name: Scrape (one widget load per club, all dates)
        id: scrape
        run: |
          DEEP=no
          case "${{ github.event.schedule }}" in
            "41 2 * * *"|"41 10 * * *"|"41 18 * * *") DEEP=yes ;;
          esac
          [ "${{ github.event.inputs.deep }}" = "yes" ] && DEEP=yes
          LAST=6
          [ "$DEEP" = "yes" ] && LAST=30
          echo "chronogolf horizon: deep=${DEEP}, days 0-${LAST}, shard ${{ matrix.shard }}/2"
          # Day 0 from scraper.dates, not `date -u` (UTC is already tomorrow
          # after ~5pm Mountain).
          START=$(python -m scraper.dates --registry registry.json --days 1 | head -1)
          echo "start=${START}" >> "$GITHUB_OUTPUT"
          echo "last=${LAST}" >> "$GITHUB_OUTPUT"
          xvfb-run -a python -m scraper.browser_chronogolf --date "${START}" \
            --days $((LAST + 1)) --shard "${{ matrix.shard }}/2" --out-dir output || true

      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, collections
          print("### Chronogolf browser — shard ${{ matrix.shard }}/2\n")
          print("| date | courses | ok | tee times | errors | empty |")
          print("|---|---|---|---|---|---|")
          kinds = collections.Counter()
          for p in sorted(glob.glob("output/chrono_*.json")):
              d = json.load(open(p))
              for e in d["errors"]:
                  kinds[e["error"].split(" (")[0][:70]] += 1
              print(f"| {d['date']} | {d['courses_queried']} | {d['courses_ok']} | "
                    f"{len(d['tee_times'])} | {len(d['errors'])} | {len(d['courses_empty'])} |")
          if kinds:
              print("\n**Error kinds (course-dates):**\n")
              for k, n in kinds.most_common():
                  print(f"- {n} × {k}")
          PY

      - name: Push each date to D1 (main only)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          VPS_ONLY: "1"
          ONETEE_API_URL: https://api.oneteeapp.com
          ONETEE_INGEST_TOKEN: ${{ secrets.VPS_INGEST_TOKEN }}
        run: |
          START="${{ steps.scrape.outputs.start }}"
          for OFFSET in $(seq 0 ${{ steps.scrape.outputs.last }}); do
            DATE=$(date -d "$START +${OFFSET} days" +%F)
            [ -f "output/chrono_${DATE}.json" ] && \
              python -m scraper.d1 push --data "output/chrono_${DATE}.json" || true
          done
