name: Migrate accounts D1 -> VPS (one-shot)

# One-shot, manual. Copies the gate's account tables (users, billing_events,
# searches) from Cloudflare D1 into the VPS Postgres via /exec. Run ONCE,
# immediately before the gate cutover, so paid tiers + saved searches carry
# over. Idempotent (upsert users / ignore dup events+searches), so a re-run is
# safe while the gate is still on D1.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: migrate-accounts
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Migrate accounts D1 -> VPS
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          ONETEE_API_URL: https://api.oneteeapp.com
          ONETEE_INGEST_TOKEN: ${{ secrets.VPS_INGEST_TOKEN }}
        run: python -m scraper.migrate_accounts
