name: Scrape Trutee via browser (0-6 hourly, 0-30 daily)

# Trutee (trutee.app) is a Next.js RSC app: the tee-time data is not in any JSON
# API, not in the SSR HTML, and not in a capturable XHR — it renders into the DOM
# only after client hydration. A real Chromium loads the org portal per date
#   https://trutee.app/courses/o/<org>?date=YYYY-MM-DD
# and scrapes the rendered cards, attributing each to its venue by course name.
# The plain scraper --excludes trutee, so this job solely owns those slugs.

# 2026-09-01: moved to the self-hosted runner on the scraper VPS (label
# "scraper"). Same job, your hardware: no 20-slot concurrency cap, no queueing
# behind the near-tier loops, and Chromium/xvfb come preinstalled by
# vps/scraper-host/bootstrap.sh instead of apt-under-sudo per run.
on:
  schedule:
    # Split so the DEEP slots have their own cron STRINGS to match on — a
    # single "43 * * * *" makes every hour indistinguishable to
    # github.event.schedule. Three deep slots, 8h apart.
    - cron: "43 0,1,3,4,5,6,7,8,9,11,12,13,14,15,16,17,19,20,21,22,23 * * *"
    - cron: "43 2 * * *"
    - cron: "43 10 * * *"
    - cron: "43 18 * * *"
  workflow_dispatch:
    inputs:
      deep:
        description: "Scrape the full 0-30 day horizon"
        default: "no"
  push:
    branches: [main]
    paths:
      - "registry.json"
      - "scraper/browser_trutee.py"
      - ".github/workflows/scrape-trutee-browser.yml"

permissions:
  contents: read

concurrency:
  group: scrape-trutee-browser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: [self-hosted, linux, scraper]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium
        run: |
          pip install requests playwright
          python -m playwright install chromium   # deps preinstalled by vps/scraper-host/bootstrap.sh
      - name: Scrape the horizon + push each date to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          VPS_ONLY: "1"
          ONETEE_API_URL: https://api.oneteeapp.com
          ONETEE_INGEST_TOKEN: ${{ secrets.VPS_INGEST_TOKEN }}
        run: |
          # Hourly runs cover days 0-6; the 10:xx UTC run (~4am Denver) and a
          # manual deep dispatch stretch to the full 30-day horizon. One org
          # portal load per date covers all four City of St. George courses, so
          # this is a handful of page loads per date — cheap.
          DEEP=no
          # WHY THIS MATCHES THE CRON STRING AND NOT THE CLOCK.
          #
          # This gate used to read:
          #     [ "$(date -u +%H)" = "10" ] && DEEP=yes
          # a wall-clock hour equality evaluated INSIDE the job, so it only held
          # if the runner reached this line during that UTC hour. GitHub delivers
          # scheduled events late under load and drops slots outright, and a
          # queued job can start an hour after its slot — so the deep sweep was
          # silently skipped whenever either happened, taking days 7-30 with it.
          # That exact bug cost ~8,000 golfwithaccess tee times on 2026-08-14.
          # github.event.schedule is the cron expression that FIRED, so delivery
          # jitter cannot move a run out of its slot.
          case "${{ github.event.schedule }}" in
            "43 2 * * *"|"43 10 * * *"|"43 18 * * *") DEEP=yes ;;
          esac
          [ "${{ github.event.inputs.deep }}" = "yes" ] && DEEP=yes
          LAST=6
          [ "$DEEP" = "yes" ] && LAST=30
          # Dates from scraper.dates (union of local todays), not `date -u`:
          # after ~5pm Mountain the UTC date is already tomorrow.
          for DATE in $(python -m scraper.dates --registry registry.json --days "$((LAST + 1))"); do
            OUT="output/trutee_${DATE}.json"
            python -m scraper.browser_trutee --date "${DATE}" --out "${OUT}" || true
            python -m scraper.d1 push --data "${OUT}" || true
          done
