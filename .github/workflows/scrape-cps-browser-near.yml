name: Scrape CPS challenged tenants near (days 0-3, self-chaining 30-min loop)

# WHY (2026-08-07). The Cloudflare-CHALLENGED cps.golf tenants (indian-tree etc.)
# refresh their near window (days 0-3) here on a self-chaining 30-min loop.
#
# 2026-08-10 — NO MORE RESIDENTIAL PROXY. These tenants blocked our VANILLA
# Playwright because it leaks Runtime.enable over CDP (Cloudflare's managed
# challenge flags it), NOT because of the datacenter IP. browser_cps now drives
# PATCHRIGHT (a Runtime.enable-patched Playwright fork) + real Chrome headful under
# xvfb, which clears Cloudflare straight from the free GitHub runner with NO proxy
# (proven: probe run 31350985854 — cattailcreek/flatirons/marianabutte cleared,
# 46/47/21 tee times). So this loop is now FREE: no TEEITUP_PROXY, no metered
# bandwidth. The residential 10GB/2-day burn is gone.
#
# FIX (unchanged). A SELF-CHAINING loop that re-scrapes days 0-3 for the challenged
# tenants every 30 min and dispatches its OWN successor. watchdog-near-loops.yml
# revives it if both the self-chain and the hourly cron backstop miss.
#
# OWNERSHIP (no double-write). This loop owns the challenged tenants' days 0-3;
# the daily deep in scrape-cps-browser.yml owns days 4-30 (disjoint). Plain-direct
# tenants are a disjoint TENANT set (CPS_ONLY split). One writer per (slug,date).

on:
  schedule:
    - cron: "19 * * * *"        # crash backstop ONLY; self-chain is primary
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write                # the loop chains the next run

concurrency:
  group: scrape-cps-browser-near
  cancel-in-progress: false     # queued successor waits; never kill the loop

env:
  INTERVAL_SECONDS: 1800        # one pass per 30 min (padded; a pass is shorter)
  LOOP_MINUTES: 315             # stop looping after this; job timeout is 335

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 335
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + patched browser + xvfb (once per run)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install requests patchright
          # Chrome is preinstalled on ubuntu-latest and the code prefers
          # channel="chrome"; this bundled patched chromium is the fallback + brings
          # the system libs.
          patchright install --with-deps chromium
      - name: Loop challenged cps tenants over days 0-3 (30-min cadence)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          CPS_ONLY: browser          # only the Cloudflare-challenged tenants
          # NO proxy — Patchright + real Chrome headful clears Cloudflare from the
          # datacenter IP. Keep full assets (match the proven probe; bandwidth is
          # free now). Lower concurrency because headful Chrome is heavier.
          CPS_KEEP_ASSETS: "1"
          CPS_CONCURRENCY: "3"
        run: |
          START=$(date +%s)
          PASS=0
          while true; do
            NOW=$(date +%s)
            ELAPSED_MIN=$(( (NOW - START) / 60 ))
            if [ "$ELAPSED_MIN" -ge "$LOOP_MINUTES" ]; then
              echo "loop budget spent after $PASS passes"; break
            fi
            PASS=$((PASS + 1))
            T0=$(date +%s)
            mkdir -p output
            rm -f output/cps_*.json          # avoid re-pushing a prior pass's files
            # days 0-3 (union of local todays), ONE session per tenant.
            DATES=$(python -m scraper.dates --registry registry.json --days 4)
            CSV=$(echo "$DATES" | paste -sd, -)
            echo "::group::cps browser near pass ${PASS} (${CSV})"
            xvfb-run -a python -m scraper.browser_cps --dates "${CSV}" --out-dir output --registry registry.json || true
            for DATE in $DATES; do
              [ -e "output/cps_${DATE}.json" ] && python -m scraper.d1 push --data "output/cps_${DATE}.json" || true
            done
            echo "::endgroup::"
            T1=$(date +%s)
            TOOK=$((T1 - T0))
            SLEEP=$((INTERVAL_SECONDS - TOOK))
            if [ "$SLEEP" -gt 0 ]; then
              echo "pass ${PASS} took ${TOOK}s; sleeping ${SLEEP}s"
              sleep "$SLEEP"
            else
              echo "pass ${PASS} took ${TOOK}s (over interval; no sleep)"
            fi
          done

      - name: Chain the next loop run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scrape-cps-browser-near.yml --ref main --repo "${{ github.repository }}" \
            && echo "successor dispatched" || echo "dispatch failed; cron backstop will restart"
