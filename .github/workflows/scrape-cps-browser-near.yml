name: Scrape CPS challenged tenants near (days 0-3, self-chaining loop)

# WHY (2026-08-07). The Cloudflare-CHALLENGED cps.golf tenants (indian-tree etc.)
# refresh their near window (days 0-3) here on a self-chaining 30-min loop.
#
# 2026-08-10 — NO MORE RESIDENTIAL PROXY. These tenants blocked our VANILLA
# Playwright because it leaks Runtime.enable over CDP (Cloudflare's managed
# challenge flags it), NOT because of the datacenter IP. browser_cps now drives
# PATCHRIGHT (a Runtime.enable-patched Playwright fork) + real Chrome headful under
# xvfb, which clears Cloudflare straight from the free GitHub runner with NO proxy
# (proven: probe run 31350985854 — cattailcreek/flatirons/marianabutte cleared,
# 46/47/21 tee times). So this loop is now FREE: no TEEITUP_PROXY, no metered
# bandwidth. The residential 10GB/2-day burn is gone.
#
# FIX (unchanged). A SELF-CHAINING loop that re-scrapes days 0-3 for the challenged
# tenants every 30 min and dispatches its OWN successor. watchdog-near-loops.yml
# revives it if both the self-chain and the hourly cron backstop miss.
#
# OWNERSHIP (no double-write). This loop owns the challenged tenants' days 0-3;
# the daily deep in scrape-cps-browser.yml owns days 4-30 (disjoint). Plain-direct
# tenants are a disjoint TENANT set (CPS_ONLY split). One writer per (slug,date).

on:
  schedule:
    - cron: "19 * * * *"        # crash backstop ONLY; self-chain is primary
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write                # the loop chains the next run

concurrency:
  group: scrape-cps-browser-near
  cancel-in-progress: false     # queued successor waits; never kill the loop

env:
  # 300, from a repo VARIABLE so it reverts without a commit.
  #
  # This was 1800 and the comment said "padded; a pass is shorter". Measured
  # 2026-08-16 across a full 5.25h run: a pass takes 230s median (min 212, max
  # 258) and the cadence was 1801s. The loop was sleeping 26 of every 30 minutes,
  # which made these the only near-tier courses refreshing at 30 minutes while
  # every other loop in the fleet runs at 5.
  #
  # THE RISK IS NOT RUNNER COST — the job is held for the full 5.25h either way.
  # It is that these are the Cloudflare-CHALLENGED tenants, cleared by Patchright
  # + headful Chrome, and this is a 6x increase in request rate against them. If
  # challenge rates rise, set the repo variable CPS_NEAR_INTERVAL back to 1800.
  # No commit, no deploy, takes effect on the next loop run.
  #
  # The per-pass health line below is the signal to watch: a collapse in tee
  # times or courses means we are being challenged, not that inventory moved.
  INTERVAL_SECONDS: ${{ vars.CPS_NEAR_INTERVAL || 300 }}
  # DAYS 4-7 USED TO HAVE NO OWNER ON THIS LOOP. It covered days 0-3 only, so the
  # challenged tenants' days 4-7 came solely from scrape-cps-browser.yml's deep
  # sweep — nominally twice a day, but measured 2026-08-17 its run-to-run gaps
  # were 55, 1392, 101 and 456 minutes. The 1392-minute gap (23h) is past the read
  # API's 18h mid-tier freshness cut, so those ~27 courses' days 4-7 inventory was
  # hidden outright for hours with nothing reporting it. Same staleness pattern
  # scrape-near.yml and scrape-teeitup-browser-near.yml already use: the near
  # dates every pass, the further ones only once they age past this.
  FAR_STALE_SECONDS: 600        # days 4-7 refresh interval (<= 10 min + a pass)
  LOOP_MINUTES: 315             # stop looping after this; job timeout is 335

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 335
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + patched browser + xvfb (once per run)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install requests patchright
          # Chrome is preinstalled on ubuntu-latest and the code prefers
          # channel="chrome"; this bundled patched chromium is the fallback + brings
          # the system libs.
          patchright install --with-deps chromium
      - name: Loop challenged cps tenants over days 0-7
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          VPS_ONLY: "1"
          ONETEE_API_URL: https://api.oneteeapp.com
          ONETEE_INGEST_TOKEN: ${{ secrets.VPS_INGEST_TOKEN }}
          CPS_ONLY: browser          # only the Cloudflare-challenged tenants
          # NO proxy — Patchright + real Chrome headful clears Cloudflare from the
          # datacenter IP. Keep full assets (match the proven probe; bandwidth is
          # free now). Lower concurrency because headful Chrome is heavier.
          CPS_KEEP_ASSETS: "1"
          CPS_CONCURRENCY: "3"
        run: |
          START=$(date +%s)
          PASS=0
          # 0 so the FIRST pass of every run covers the full window — a fresh
          # runner (or one restarted after a crash or cancel) never inherits a
          # stale day 5.
          LAST_FAR=0
          while true; do
            NOW=$(date +%s)
            ELAPSED_MIN=$(( (NOW - START) / 60 ))
            if [ "$ELAPSED_MIN" -ge "$LOOP_MINUTES" ]; then
              echo "loop budget spent after $PASS passes"; break
            fi
            PASS=$((PASS + 1))
            T0=$(date +%s)
            mkdir -p output
            rm -f output/cps_*.json          # avoid re-pushing a prior pass's files
            # Days 0-3 every pass; days 4-7 folded in only once they are
            # FAR_STALE_SECONDS old. Widening every pass would roughly double the
            # work (one session per tenant covers ALL the dates given), pushing a
            # ~254s pass past the 300s interval every time; this way the cost is
            # paid every other pass instead. ONE session per tenant either way.
            FAR_AGE=$(( T0 - LAST_FAR ))
            if [ "$FAR_AGE" -ge "$FAR_STALE_SECONDS" ]; then
              DAYS=8; LAST_FAR=$T0; SCOPE="days 0-7"
            else
              DAYS=4; SCOPE="days 0-3"
            fi
            DATES=$(python -m scraper.dates --registry registry.json --days "$DAYS")
            CSV=$(echo "$DATES" | paste -sd, -)
            echo "::group::cps browser near pass ${PASS} ${SCOPE} (${CSV})"
            xvfb-run -a python -m scraper.browser_cps --dates "${CSV}" --out-dir output --registry registry.json || true
            for DATE in $DATES; do
              [ -e "output/cps_${DATE}.json" ] && python -m scraper.d1 push --data "output/cps_${DATE}.json" || true
            done
            echo "::endgroup::"
            # PER-PASS HEALTH, so a challenge wall is visible in the log without
            # reading the whole thing. Rows AND distinct courses: rows alone fall
            # naturally through the day as slots are booked, but the course count
            # is flat unless something is blocking us.
            HEALTH=$(python -c "import glob,json;rs=[t for f in glob.glob('output/cps_*.json') for t in (json.load(open(f)).get('tee_times') or [])];print(len(rs), len({t.get('course_slug') for t in rs}))" 2>/dev/null || echo "?? ??")
            echo "pass ${PASS} health: ${HEALTH} (tee_times, distinct courses)"
            T1=$(date +%s)
            TOOK=$((T1 - T0))
            SLEEP=$((INTERVAL_SECONDS - TOOK))
            if [ "$SLEEP" -gt 0 ]; then
              echo "pass ${PASS} took ${TOOK}s; sleeping ${SLEEP}s"
              sleep "$SLEEP"
            else
              echo "pass ${PASS} took ${TOOK}s (over interval; no sleep)"
            fi
          done

      - name: Chain the next loop run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scrape-cps-browser-near.yml --ref main --repo "${{ github.repository }}" \
            && echo "successor dispatched" || echo "dispatch failed; cron backstop will restart"
