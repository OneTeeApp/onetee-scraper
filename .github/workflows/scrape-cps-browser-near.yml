name: Scrape CPS challenged tenants near (days 0-3, self-chaining 30-min loop)

# WHY (2026-08-07). The Cloudflare-CHALLENGED cps.golf tenants (indian-tree etc.)
# are reachable ONLY via the metered residential-proxy browser path. Their near
# window (days 0-3) was refreshed by a plain cron in scrape-cps-browser.yml —
# first every 2h, then */30 — but GitHub cron drifts/throttles sub-hourly
# schedules, so the real cadence (and thus day-0 freshness) was unreliable: a
# booked slot could linger for hours (observed on indian-tree).
#
# FIX. A SELF-CHAINING loop that re-scrapes days 0-3 for the challenged tenants
# every 30 min and dispatches its OWN successor at the end. Cadence no longer
# depends on GitHub cron. The hourly cron here is only a crash backstop, and
# watchdog-near-loops.yml revives the loop if BOTH the self-chain and the cron
# backstop miss (e.g. a GitHub Actions incident).
#
# OWNERSHIP (no double-write). This loop owns the challenged tenants' days 0-3.
# The daily deep in scrape-cps-browser.yml now owns days 4-30 (a DISJOINT range),
# so the two never write the same (slug,date) and need no shared concurrency
# group. The plain-direct tenants are a disjoint TENANT set (CPS_ONLY split),
# scraped by scrape-cps-browser.yml's plain job. So every challenged (slug,date)
# has exactly one writer.
#
# COST. ~16 challenged tenants x 1 Cloudflare page-load each per pass, 48 passes/
# day. browser_cps does ONE page-load per tenant covering all near dates and
# blocks image/media/font + forces a US exit, which is what keeps a 30-min
# residential cadence affordable.

on:
  schedule:
    - cron: "19 * * * *"        # crash backstop ONLY; self-chain is primary
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write                # the loop chains the next run

concurrency:
  group: scrape-cps-browser-near
  cancel-in-progress: false     # queued successor waits; never kill the loop

env:
  INTERVAL_SECONDS: 1800        # one pass per 30 min (padded; a pass is shorter)
  LOOP_MINUTES: 315             # stop looping after this; job timeout is 335

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 335
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium (once per run)
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Loop challenged cps tenants over days 0-3 (30-min cadence)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          CPS_ONLY: browser          # only the Cloudflare-challenged tenants
          # METERED residential proxy — browser_cps forces a US exit + blocks
          # image/media/font to conserve bandwidth. Unset = direct (would 403).
          TEEITUP_PROXY: ${{ secrets.TEEITUP_PROXY }}
        run: |
          START=$(date +%s)
          PASS=0
          while true; do
            NOW=$(date +%s)
            ELAPSED_MIN=$(( (NOW - START) / 60 ))
            if [ "$ELAPSED_MIN" -ge "$LOOP_MINUTES" ]; then
              echo "loop budget spent after $PASS passes"; break
            fi
            PASS=$((PASS + 1))
            T0=$(date +%s)
            mkdir -p output
            rm -f output/cps_*.json          # avoid re-pushing a prior pass's files
            # days 0-3 (union of local todays), ONE session per tenant.
            DATES=$(python -m scraper.dates --registry registry.json --days 4)
            CSV=$(echo "$DATES" | paste -sd, -)
            echo "::group::cps browser near pass ${PASS} (${CSV})"
            python -m scraper.browser_cps --dates "${CSV}" --out-dir output --registry registry.json || true
            for DATE in $DATES; do
              [ -e "output/cps_${DATE}.json" ] && python -m scraper.d1 push --data "output/cps_${DATE}.json" || true
            done
            echo "::endgroup::"
            T1=$(date +%s)
            TOOK=$((T1 - T0))
            SLEEP=$((INTERVAL_SECONDS - TOOK))
            if [ "$SLEEP" -gt 0 ]; then
              echo "pass ${PASS} took ${TOOK}s; sleeping ${SLEEP}s"
              sleep "$SLEEP"
            else
              echo "pass ${PASS} took ${TOOK}s (over interval; no sleep)"
            fi
          done

      - name: Chain the next loop run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scrape-cps-browser-near.yml --ref main --repo "${{ github.repository }}" \
            && echo "successor dispatched" || echo "dispatch failed; cron backstop will restart"
