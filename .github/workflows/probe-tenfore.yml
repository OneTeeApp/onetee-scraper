name: Probe TenFore (isolated, fast — plain /api/TeeSheet)

# TenFore is now a PLAIN-HTTP adapter: it reads the OPEN /api/TeeSheet endpoint
# (no reCAPTCHA) instead of the gated Search. This probe runs ONLY the tenfore
# platform through the normal aggregator, pushes to D1, and prints counts — a
# fast, isolated check that plain HTTP to swan.tenfore.golf works from a runner.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (plain HTTP only)
        run: pip install requests
      - name: Scrape tenfore (plain) + push to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          VPS_DUALWRITE: "1"
          ONETEE_API_URL: https://api.oneteeapp.com
          ONETEE_INGEST_TOKEN: ${{ secrets.VPS_INGEST_TOKEN }}
        run: |
          for DATE in $(python -m scraper.dates --registry registry.json --days 4); do
            OUT="output/tenfore_${DATE}.json"
            python -m scraper.aggregate --date "${DATE}" --workers 6 \
              --platforms tenfore --registry registry.json --out "${OUT}" || true
            python -c "import json,sys; d=json.load(open('${OUT}')); print('${OUT}', 'tee_times=', len(d['tee_times']), 'errors=', len(d['errors'])); [print('   ERR', e['course'], str(e.get('error'))[:120]) for e in d['errors'][:6]]" || true
            python -m scraper.d1 push --data "${OUT}" || true
          done
