name: Scrape CPS via browser (0-6 every 6h, 0-30 daily)

# Club Prophet (cps.golf) tenants whose WAF blocks the plain HTTP client's TLS
# fingerprint from datacenter IPs are fetched with a real headless Chromium,
# which clears the WAF (verified: Flatirons/Fossil 200 via browser vs 403 via
# requests). The plain scraper excludes clubprophet, so this job solely owns
# those course_slugs in D1.
#
# CADENCE IS DELIBERATELY LOW (2026-08-06): the challenged tenants go through a
# METERED residential proxy and browser page-loads are heavy. Running hourly,
# plus a full scrape on every code push, exhausted the Webshare residential plan
# in a day (402 Payment Required). So: near tier (days 0-6) every 6h, deep
# (0-30) once daily, and NO push trigger — code/registry changes are picked up
# by the next scheduled run (each run checks out latest main). Use
# workflow_dispatch to force a run. browser_cps also blocks image/media/font
# requests to cut residential bandwidth per page ~10x. Raise cadence only if
# bandwidth allows, or after splitting the free plain-direct tenants onto their
# own frequent job.

on:
  schedule:
    - cron: "37 */6 * * *"   # near tier (days 0-6): 00:37, 06:37, 12:37, 18:37 UTC
    - cron: "7 10 * * *"     # deep (days 0-30): once daily at 10:07 UTC (DEEP gate = hour 10)
  workflow_dispatch:
    inputs:
      deep:
        description: "Scrape the full 0-30 day horizon"
        default: "no"

permissions:
  contents: read

concurrency:
  group: scrape-cps-browser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Scrape + push each date to D1 (tiered horizon)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          # Residential proxy so cps.golf's Cloudflare challenge clears from the
          # data-center IP. Unset = direct (unchanged); browser_cps reads it.
          TEEITUP_PROXY: ${{ secrets.TEEITUP_PROXY }}
        run: |
          # Hourly runs cover days 0-6; the 10:xx UTC run (~4am Denver) and a
          # manual deep dispatch stretch to the full 30-day horizon. Browser
          # scrapes are too slow to loop at the near tier's cadence, so daily
          # is the far-tier freshness for these platforms.
          DEEP=no
          [ "$(date -u +%H)" = "10" ] && DEEP=yes
          [ "${{ github.event.inputs.deep }}" = "yes" ] && DEEP=yes
          LAST=6
          [ "$DEEP" = "yes" ] && LAST=30
          # Dates from scraper.dates (union of local todays across covered
          # timezones), not `date -u`: after ~5pm Mountain the UTC date is
          # already tomorrow and a UTC "today" skips the real one.
          for DATE in $(python -m scraper.dates --registry registry.json --days "$((LAST + 1))"); do
            echo "::group::cps browser ${DATE}"
            python -m scraper.browser_cps --date "${DATE}" \
              --out "output/cps_${DATE}.json" || true
            python -m scraper.d1 push --data "output/cps_${DATE}.json" || true
            echo "::endgroup::"
          done
