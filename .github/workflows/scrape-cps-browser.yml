name: Scrape CPS via browser (0-6 hourly, 0-30 daily)

# Club Prophet (cps.golf) tenants whose WAF blocks the plain HTTP client's TLS
# fingerprint from datacenter IPs are fetched with a real headless Chromium,
# which clears the WAF (verified: Flatirons/Fossil 200 via browser vs 403 via
# requests). Runs hourly — these are not as time-sensitive as same-day slots,
# and spinning up Chromium every 5 min would be wasteful. The plain scraper
# excludes clubprophet, so this job solely owns those course_slugs in D1.

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      deep:
        description: "Scrape the full 0-30 day horizon"
        default: "no"
  push:
    branches: [main]
    paths:
      - "registry.json"
      - "scraper/browser_cps.py"
      - "scraper/adapters/clubprophet.py"
      - ".github/workflows/scrape-cps-browser.yml"

permissions:
  contents: read

concurrency:
  group: scrape-cps-browser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Scrape + push each date to D1 (tiered horizon)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
        run: |
          # Hourly runs cover days 0-6; the 10:xx UTC run (~4am Denver) and a
          # manual deep dispatch stretch to the full 30-day horizon. Browser
          # scrapes are too slow to loop at the near tier's cadence, so daily
          # is the far-tier freshness for these platforms.
          DEEP=no
          [ "$(date -u +%H)" = "10" ] && DEEP=yes
          [ "${{ github.event.inputs.deep }}" = "yes" ] && DEEP=yes
          LAST=6
          [ "$DEEP" = "yes" ] && LAST=30
          for OFFSET in $(seq 0 $LAST); do
            DATE=$(date -u -d "+${OFFSET} days" +%F)
            echo "::group::cps browser ${DATE}"
            python -m scraper.browser_cps --date "${DATE}" \
              --out "output/cps_${DATE}.json" || true
            python -m scraper.d1 push --data "output/cps_${DATE}.json" || true
            echo "::endgroup::"
          done
