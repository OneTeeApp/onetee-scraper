name: Scrape CPS (plain tenants every 10 min; challenged near = self-chaining loop, deep daily)

# Club Prophet (cps.golf). Two cost profiles on two cadences:
#
#   * PLAIN-DIRECT tenants (_DC_DIRECT_TENANTS in browser_cps): plain HTTP, no
#     proxy, no browser. cps.golf's Cloudflare does not challenge them from a
#     datacenter IP. HOURLY near (0-3) + daily deep (0-30). CPS_ONLY=plain.
#
#   * CHALLENGED tenants (the rest): Cloudflare challenges them. As of 2026-08-10
#     they are scraped with PATCHRIGHT (Runtime.enable-patched Playwright) driving
#     real Chrome headful under xvfb — which clears Cloudflare from a plain
#     datacenter IP with NO residential proxy (the block was automation detection,
#     not IP; proven by probe run 31350985854). browser_cps scrapes ALL dates in
#     ONE browser session per tenant. Their NEAR window (days 0-3) is owned by the
#     self-chaining loop scrape-cps-browser-near.yml; the `browser` job HERE does
#     the DEEP TAIL, days 4-30 (disjoint), once daily. CPS_ONLY=browser. FREE now
#     (no TEEITUP_PROXY). Plain path does NOT work for these (they 403 a datacenter
#     plain request) — the stealth browser is required.
#
# NO push trigger: scheduled runs check out latest main. Disjoint tenant sets
# (plain vs browser) and disjoint date ranges (near vs deep) => one writer per
# (slug,date).

on:
  schedule:
    # PLAIN, near (0-3): every 10 minutes — free, and the job runs in 1-2 min.
    #
    # WAS hourly, and that was the least fresh near tier in the fleet: every
    # other near platform re-reads days 0-3 on a 5-minute self-chaining loop,
    # and the challenged cps tenants get a 30-minute one, but these 17
    # plain-direct courses were re-read once an hour. Worse, GitHub delivers
    # this cron late or not at all under load — observed gaps on 2026-08-15 of
    # 83 and 118 minutes (17:39 -> 19:37) — so the real worst case was about two
    # hours. A slot booked just after a run stayed on the site for that whole
    # window, which is how Walnut Creek came to advertise a 12:30 that the
    # booking site no longer had.
    #
    # Six short runs an hour cost ~10 runner-minutes; scrape-near.yml holds a
    # runner continuously for five hours. This is the cheapest freshness in the
    # fleet, and spreading it across six slots also means a dropped delivery
    # costs 10 minutes instead of an hour.
    - cron: "2,12,22,32,42,52 * * * *"
    - cron: "17 8 * * *"     # PLAIN, deep (0-30): daily   — free
    - cron: "7 10 * * *"     # BROWSER, deep (4-30): daily  — free (Patchright, no proxy)
  workflow_dispatch:
    inputs:
      set:
        description: "which tenants: plain | browser | all"
        default: "all"
      deep:
        description: "full 0-30 day horizon?"
        default: "no"

permissions:
  contents: read

jobs:
  # -------- FREE plain-direct tenants: hourly near + daily deep, no Chromium ----
  plain:
    # INVERTED ON PURPOSE: run on every scheduled delivery EXCEPT the browser
    # job's slot, rather than listing the two crons this job owns.
    #
    # The listing form has a silent, total failure mode. If the string GitHub
    # reports in github.event.schedule ever differs by even one character from
    # the literal here — and the every-10-minutes cron below is the first
    # comma-list expression in this repo, so that equality is untested for this
    # form — the condition is false on every scheduled run, the job is SKIPPED,
    # and 17 courses go dark with a green tick on every run. Inverted, the same
    # mismatch costs one extra 1-minute plain sweep a day at 10:07 and nothing
    # else. Both directions of the risk are asymmetric and this is the cheap one.
    #
    # DEEP is still decided by an exact match on '17 8 * * *' inside the step,
    # which is fail-safe for the opposite reason: a mismatch there yields a near
    # sweep instead of a deep one, not silence.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule != '7 10 * * *')
      || (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.set == 'plain' || github.event.inputs.set == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: scrape-cps-plain
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests      # plain HTTP only — no Chromium, no proxy
      - name: Scrape plain-direct cps tenants + push each date to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          VPS_ONLY: "1"
          ONETEE_API_URL: https://api.oneteeapp.com
          ONETEE_INGEST_TOKEN: ${{ secrets.VPS_INGEST_TOKEN }}
          CPS_ONLY: plain            # only _DC_DIRECT_TENANTS (no proxy, no bandwidth)
        run: |
          # Matched on the cron STRING, not the clock: github.event.schedule is
          # the expression that fired, so a late delivery cannot silently turn a
          # deep sweep into a near one. (The three browser workflows learned
          # this the hard way on 2026-08-14 — see scrape-golfwithaccess-browser.)
          DEEP=no
          [ "${{ github.event.schedule }}" = "17 8 * * *" ] && DEEP=yes
          [ "${{ github.event.inputs.deep }}" = "yes" ] && DEEP=yes
          LAST=3
          [ "$DEEP" = "yes" ] && LAST=30
          DATES=$(python -m scraper.dates --registry registry.json --days "$((LAST + 1))" | paste -sd, -)
          echo "cps plain dates: ${DATES}"
          python -m scraper.browser_cps --dates "${DATES}" --out-dir output --registry registry.json || true
          for f in output/cps_*.json; do
            [ -e "$f" ] && python -m scraper.d1 push --data "$f" || true
          done

  # -------- CHALLENGED tenants: daily DEEP TAIL (days 4-30), Patchright + real Chrome --
  # NEAR (days 0-3) is owned by the self-chaining loop scrape-cps-browser-near.yml.
  browser:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '7 10 * * *')
      || (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.set == 'browser' || github.event.inputs.set == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: scrape-cps-browser
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + patched browser + xvfb
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install requests patchright
          patchright install --with-deps chromium
      - name: Scrape challenged cps tenants (Patchright, no proxy) + push each date to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          VPS_ONLY: "1"
          ONETEE_API_URL: https://api.oneteeapp.com
          ONETEE_INGEST_TOKEN: ${{ secrets.VPS_INGEST_TOKEN }}
          CPS_ONLY: browser          # only the Cloudflare-challenged tenants
          # NO proxy — Patchright + real Chrome headful clears Cloudflare from the
          # datacenter. Full assets (match proven probe); lower concurrency (headful).
          CPS_KEEP_ASSETS: "1"
          CPS_CONCURRENCY: "3"
        run: |
          # DEEP TAIL only: days 4-30 (near 0-3 is owned by the loop). scraper.dates
          # lists earliest-first, so `tail -n +5` keeps day 4 onward.
          ALL=$(python -m scraper.dates --registry registry.json --days 31)
          DATES=$(echo "$ALL" | tail -n +5)
          CSV=$(echo "$DATES" | paste -sd, -)
          echo "cps browser DEEP TAIL dates: ${CSV}"
          xvfb-run -a python -m scraper.browser_cps --dates "${CSV}" --out-dir output --registry registry.json || true
          for DATE in $DATES; do
            [ -e "output/cps_${DATE}.json" ] && python -m scraper.d1 push --data "output/cps_${DATE}.json" || true
          done
