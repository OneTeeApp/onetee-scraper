name: State coverage status

# The macro health check. Runs the per-state funnel against live D1 counts,
# commits the report and the dashboard, and FAILS if a state regressed.
#
# This is the thing that has to still work at fifty states. It does not name
# courses in its pass/fail decision — it compares one number per state
# (live venues) against the last committed run. A single broken adapter shows
# up as "AZ live 133 -> 112", which is one line to read, and the blocker table
# in the committed report says which platform to look at.
#
# The regression gate is deliberately asymmetric: a DROP fails the job, a RISE
# is committed silently. Coverage going up never needs a human.
#
# The comparison baseline is probe-results/state-status.baseline.json, a
# tracked file that ONLY advances when the gate passes (or when a dispatch
# says accept_baseline=yes). The gate used to compare against the previous
# run's report, which this workflow had already overwritten — so a regression
# fired exactly once and the next day's run was green against the regressed
# numbers. An alarm that self-mutes after one firing is not an alarm.

on:
  schedule:
    - cron: "41 13 * * *"        # daily, well after the hourly scans settle
  workflow_dispatch:
    inputs:
      tolerance:
        description: "Allowed drop in live venues per state before failing"
        default: "3"
      accept_baseline:
        description: "yes = adopt today's counts as the new baseline even if lower (acknowledges a real, understood drop)"
        default: ""
  push:
    branches: [main]
    paths:
      - "scripts/state_status.py"
      - "scripts/state_dashboard.py"
      - ".github/workflows/state-status.yml"

permissions:
  contents: write

concurrency:
  group: state-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt || pip install requests

      - name: Seed the baseline on first run
        run: |
          mkdir -p probe-results
          # Migration: before the tracked baseline existed the gate compared
          # against the previous report. Seed from it once; after that the
          # baseline file only moves when the gate passes.
          if [ ! -f probe-results/state-status.baseline.json ]; then
            cp probe-results/state-status.json \
               probe-results/state-status.baseline.json 2>/dev/null \
              || echo '{"states":[]}' > probe-results/state-status.baseline.json
          fi

      - name: Build the funnel against live D1 counts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
        run: |
          set -o pipefail
          python scripts/state_status.py --d1 \
            --json probe-results/state-status.json \
            2>&1 | tee probe-results/state-status.txt
          python scripts/state_dashboard.py probe-results/state-status.json \
            -o probe-results/onetee-status.html \
            --stamp "as of $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          sed -n '1,14p' probe-results/state-status.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Gate BEFORE commit, against the tracked baseline. continue-on-error
      # lets the fresh report/dashboard still be committed during an incident
      # (so the dashboard shows the truth); the final step re-raises the
      # failure so the run stays red every day until coverage recovers or the
      # drop is explicitly accepted.
      - name: Check for regression against the baseline
        id: gate
        if: always()
        continue-on-error: true
        env:
          INPUT_TOLERANCE: ${{ github.event.inputs.tolerance }}
        run: |
          python scripts/state_regression.py \
            probe-results/state-status.baseline.json \
            probe-results/state-status.json \
            --tolerance "${INPUT_TOLERANCE:-3}"

      - name: Commit
        if: always()
        env:
          INPUT_ACCEPT: ${{ github.event.inputs.accept_baseline }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results/state-status.json probe-results/state-status.txt \
                  probe-results/onetee-status.html
          # The baseline advances ONLY on a passing gate (or an explicit
          # accept) — committing the regressed report as the next comparison
          # point is what used to mute the alarm after one firing.
          if [ "${{ steps.gate.outcome }}" = "success" ] \
             || [ "${INPUT_ACCEPT}" = "yes" ]; then
            cp probe-results/state-status.json \
               probe-results/state-status.baseline.json
            git add probe-results/state-status.baseline.json
          fi
          git commit -m "State coverage status [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "could not push state status after 5 attempts"; exit 1

      - name: Fail if regressed
        if: always() && steps.gate.outcome == 'failure'
        run: |
          echo "state_regression failed against the baseline (see the gate step)"
          exit 1
