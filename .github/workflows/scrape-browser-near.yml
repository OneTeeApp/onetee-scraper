name: Scrape browser platforms near (days 0-3, self-chaining loop)

# WHY (2026-08-04). The near window (days 0-3) for the headless-browser
# platforms was being HIDDEN, not missing. Each of these platforms — ezlinks,
# clubcaddie, cps (ClubProphet), golfnow, supersaas, golfwithaccess — is
# excluded from the fast plain near tier (scrape-near.yml) and scraped only by
# its own hourly + shuffled browser job. The read-path freshness guard hides
# near-date slots whose sheet_freshness stamp is older than its grace (day0 3h,
# days1-2 6h); the hourly browser cadence + GitHub cron flakiness routinely let
# near dates age past grace, so validly-scraped near availability vanished.
#
# FIX. A self-chaining loop that re-scrapes days 0-3 for every browser platform,
# fast enough to keep each near date's freshness stamp inside grace. Reliability
# comes from SELF-CHAINING (the loop dispatches its successor), not GitHub cron.
#
# 2026-08-06 — SEQUENTIAL, one job (was a 6-way parallel matrix). The matrix
# pinned 6 GitHub-hosted runners CONTINUOUSLY (each job self-chains for ~5.5h),
# which — together with the teeitup near loop and the plain near loop — starved
# the account's hosted-runner pool: scheduled maintenance, the cps residential
# browser job, and ad-hoc runs failed to acquire a runner ("The job was not
# acquired by Runner of type hosted"). Looping the 6 platforms SEQUENTIALLY in a
# single job holds ONE runner instead of six; a full 6-platform pass over days
# 0-3 still finishes in ~15-25 min, far inside the 3h/6h freshness grace, so
# near stays fresh at a fraction of the runner cost.

on:
  schedule:
    - cron: "13 * * * *"        # crash backstop; self-chain is primary
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper/browser_ezlinks.py"
      - "scraper/browser_clubcaddie.py"
      - "scraper/browser_cps.py"
      - "scraper/browser_golfnow.py"
      - "scraper/browser_supersaas.py"
      - "scraper/browser_golfwithaccess.py"
      - "scraper/browser_tenfore.py"
      - ".github/workflows/scrape-browser-near.yml"

permissions:
  contents: read
  actions: write             # the loop chains the next run

concurrency:
  group: scrape-browser-near
  cancel-in-progress: false     # queued successor waits; never kill the loop

env:
  INTERVAL_SECONDS: 300         # min seconds per pass; a sequential browser pass
                                # exceeds this, so passes run back-to-back
  LOOP_MINUTES: 315             # stop looping after this; job timeout is 335

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 335
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium (once per run)
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Loop ALL browser platforms sequentially over days 0-3
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          # cps: PLAIN-DIRECT tenants ONLY here, NO residential proxy. The
          # Cloudflare-CHALLENGED cps tenants use the METERED residential proxy
          # and are scraped by scrape-cps-browser.yml's `browser` job instead;
          # TEEITUP_PROXY is intentionally NOT passed here. The plain path uses no
          # proxy regardless. cps uses the batched --dates interface (one session
          # per tenant covers all near dates).
          CPS_ONLY: plain
        run: |
          PLATFORMS="ezlinks clubcaddie cps tenfore golfnow supersaas golfwithaccess"
          START=$(date +%s)
          PASS=0
          while true; do
            NOW=$(date +%s)
            ELAPSED_MIN=$(( (NOW - START) / 60 ))
            if [ "$ELAPSED_MIN" -ge "$LOOP_MINUTES" ]; then
              echo "loop budget spent after $PASS passes"; break
            fi
            PASS=$((PASS + 1))
            T0=$(date +%s)
            mkdir -p output
            # Days 0-3; dates from scraper.dates (union of local todays).
            DATES=$(python -m scraper.dates --registry registry.json --days 4)
            CSV=$(echo "$DATES" | paste -sd, -)
            for PLAT in $PLATFORMS; do
              case "$PLAT" in
                clubcaddie)
                  # clubcaddie takes a RANGE in one widget-load-per-course call
                  # and writes output/cc_<date>.json per date.
                  D0=$(echo "$DATES" | head -1)
                  echo "::group::clubcaddie near pass ${PASS}"
                  python -m scraper.browser_clubcaddie --date "$D0" --days 4 --out-dir output || true
                  for DATE in $DATES; do
                    python -m scraper.d1 push --data "output/cc_${DATE}.json" || true
                  done
                  echo "::endgroup::"
                  ;;
                cps)
                  # Batched: one Chromium session per tenant covers all dates.
                  echo "::group::cps (plain) near pass ${PASS}"
                  python -m scraper.browser_cps --dates "$CSV" --out-dir output --registry registry.json || true
                  for DATE in $DATES; do
                    python -m scraper.d1 push --data "output/cps_${DATE}.json" || true
                  done
                  echo "::endgroup::"
                  ;;
                tenfore)
                  # Batched: ONE Chromium session mints a reCAPTCHA token in-page
                  # and queries the swan.tenfore.golf JSON API for every course x
                  # date (host-global API — no per-course navigation).
                  echo "::group::tenfore near pass ${PASS}"
                  python -m scraper.browser_tenfore --dates "$CSV" --out-dir output --registry registry.json || true
                  for DATE in $DATES; do
                    python -m scraper.d1 push --data "output/tenfore_${DATE}.json" || true
                  done
                  echo "::endgroup::"
                  ;;
                *)
                  case "$PLAT" in
                    ezlinks)         MOD=browser_ezlinks;        PFX=ez  ;;
                    golfnow)         MOD=browser_golfnow;        PFX=gn  ;;
                    supersaas)       MOD=browser_supersaas;      PFX=ss  ;;
                    golfwithaccess)  MOD=browser_golfwithaccess; PFX=gwa ;;
                  esac
                  for DATE in $DATES; do
                    OUT="output/${PFX}_${DATE}.json"
                    echo "::group::${PLAT} near pass ${PASS} ${DATE}"
                    python -m scraper."$MOD" --date "${DATE}" --out "${OUT}" || true
                    python -m scraper.d1 push --data "${OUT}" || true
                    echo "::endgroup::"
                  done
                  ;;
              esac
            done
            T1=$(date +%s)
            TOOK=$((T1 - T0))
            SLEEP=$((INTERVAL_SECONDS - TOOK))
            if [ "$SLEEP" -gt 0 ]; then
              echo "pass ${PASS} took ${TOOK}s; sleeping ${SLEEP}s"
              sleep "$SLEEP"
            else
              echo "pass ${PASS} took ${TOOK}s (over interval; no sleep)"
            fi
          done

      - name: Chain the next loop run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scrape-browser-near.yml --ref main --repo "${{ github.repository }}" \
            && echo "successor dispatched" || echo "dispatch failed; cron backstop will restart"
