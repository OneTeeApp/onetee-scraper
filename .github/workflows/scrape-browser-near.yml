name: Scrape browser platforms near (days 0-3, self-chaining loop)

# WHY (2026-08-04). The near window (days 0-3) for the headless-browser
# platforms was being HIDDEN, not missing. Each of these platforms — ezlinks,
# clubcaddie, cps (ClubProphet), golfnow, supersaas, golfwithaccess — is
# excluded from the fast plain near tier (scrape-near.yml) and scraped only by
# its own hourly + shuffled browser job. The read-path freshness guard hides
# near-date slots whose sheet_freshness stamp is older than its grace (day0 3h,
# days1-2 6h); the hourly browser cadence + GitHub cron flakiness routinely let
# near dates age past grace, so validly-scraped near availability vanished.
#
# FIX. A self-chaining loop that re-scrapes days 0-3 for every browser platform,
# fast enough to keep each near date's freshness stamp inside grace. Reliability
# comes from SELF-CHAINING (the loop dispatches its successor), not GitHub cron.
#
# 2026-08-06 — SEQUENTIAL, one job (was a 6-way parallel matrix). The matrix
# pinned 6 GitHub-hosted runners CONTINUOUSLY (each job self-chains for ~5.5h),
# which — together with the teeitup near loop and the plain near loop — starved
# the account's hosted-runner pool: scheduled maintenance, the cps residential
# browser job, and ad-hoc runs failed to acquire a runner ("The job was not
# acquired by Runner of type hosted"). Looping the 6 platforms SEQUENTIALLY in a
# single job holds ONE runner instead of six.
#
# 2026-08-12 — THE "~15-25 min" IN THE NOTE ABOVE WAS NEVER MEASURED. It was an
# estimate, and it was wrong by a factor of five. Actual logged pass times:
#
#   parallel matrix (run 31070246265, one platform per shard)
#     pass 1  1854s   pass 2  1871s   pass 3  1945s
#     pass 4  1898s   pass 5  1785s   pass 6  1946s      ~31 min per pass
#
#   sequential, all 6 platforms (run 31238525941)
#     pass 1  7176s   pass 2  7415s                      ~2 HOURS per pass
#
# Two hours against a day-0 freshness grace of 3h means day 0 spent most of its
# life close to expiry, and any hiccup pushed it over — which is what "the tee
# times are wrong" looked like from the outside. Collapsing to sequential did
# save five runners, but it cost 4x the cadence, and nobody measured it.
#
# THE FIX, and why it is not "go back to the matrix": scrape DAY 0 EVERY PASS
# and days 1-3 only every FULL_EVERY passes. Day 0 alone is a quarter of the
# work, so a day-0 pass lands around 30 min — the same cadence the 6-runner
# matrix achieved, on ONE runner. Days 1-3 refresh every ~3h, well inside their
# 6h grace, because nobody's Tuesday tee time moves minute to minute.

on:
  schedule:
    - cron: "13 * * * *"        # crash backstop; self-chain is primary
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "registry.json"
      - "scraper/browser_ezlinks.py"
      - "scraper/browser_clubcaddie.py"
      - "scraper/browser_cps.py"
      - "scraper/browser_golfnow.py"
      - "scraper/browser_supersaas.py"
      - "scraper/browser_golfwithaccess.py"
      - ".github/workflows/scrape-browser-near.yml"

permissions:
  contents: read
  actions: write             # the loop chains the next run

concurrency:
  group: scrape-browser-near
  cancel-in-progress: false     # queued successor waits; never kill the loop

env:
  INTERVAL_SECONDS: 300         # min seconds per pass; a sequential browser pass
                                # exceeds this, so passes run back-to-back
  FULL_EVERY: 4                 # every Nth pass also does days 1-3. Every other
                                # pass is day 0 only. 1 = always full (old
                                # behaviour); raise it to favour day-0 cadence.
  LOOP_MINUTES: 315             # stop looping after this; job timeout is 335
  # LANE PARALLELISM, OFF BY DEFAULT. 1 = sequential, byte-for-byte the current
  # behaviour. 2 = golfnow alone in lane 1, the other five in lane 2. Set the
  # repo variable BROWSER_LANES to 2 to turn it on; unset or set it back to 1 to
  # revert instantly, with no commit and no deploy.
  #
  # 2 and not 3. Measured on day +5, seq/par/seq, runs 31823871401 (3 lanes) and
  # 31828206175 (2 lanes):
  #
  #            wall    speedup   golfnow in the parallel pass
  #   3 lanes  755s     1.46x    46 courses 10 errors  <- WORSE than both seq passes
  #   2 lanes  745s     1.68x    48 courses  8 errors  <- BEST of the three passes
  #
  # golfnow is the most challenge-sensitive of the six and it sets the floor —
  # parallel wall time equals golfnow's own runtime in both probes. Give it a
  # lane to itself and it is unaffected; make it share with two other browsers
  # and it loses courses and gains errors. Two lanes is both faster AND safer.
  #
  # Concurrent lanes are safe to push: d1.sync scopes deactivation to the courses
  # present in that scrape, and every platform writes its own output prefix.
  BROWSER_LANES: ${{ vars.BROWSER_LANES || 1 }}

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 335
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium (once per run)
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Loop ALL browser platforms sequentially over days 0-3
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          VPS_ONLY: "1"
          ONETEE_API_URL: https://api.oneteeapp.com
          ONETEE_INGEST_TOKEN: ${{ secrets.VPS_INGEST_TOKEN }}
          # cps: PLAIN-DIRECT tenants ONLY here, NO residential proxy. The
          # Cloudflare-CHALLENGED cps tenants use the METERED residential proxy
          # and are scraped by scrape-cps-browser.yml's `browser` job instead;
          # TEEITUP_PROXY is intentionally NOT passed here. The plain path uses no
          # proxy regardless. cps uses the batched --dates interface (one session
          # per tenant covers all near dates).
          CPS_ONLY: plain
        run: |
          # tenfore is NOT here: it is now a PLAIN-HTTP adapter (OPEN /api/TeeSheet,
          # no reCAPTCHA) scraped by the plain near/mid/far tiers via
          # scraper.aggregate. Keeping it here too would double-write its slugs and
          # clobber the plain tier's rows — the plain tier is the SOLE owner.
          # cps IS DELIBERATELY ABSENT. This loop ran it with CPS_ONLY=plain —
          # the exact same tenant set that scrape-cps-plain-near.yml covers, and
          # that loop does days 0-7 on EVERY pass at a 5-minute cadence while this
          # one reached days 1-3 only every FULL_EVERY passes. Every row produced
          # here was therefore already in D1, fresher, minutes earlier. Removing it
          # shrinks lane 2 on every pass — narrow and wide — with no coverage loss.
          # (One writer per (slug,date) still holds: the challenged tenants are a
          # disjoint set owned by scrape-cps-browser-near.yml.)
          PLATFORMS="ezlinks clubcaddie golfnow supersaas golfwithaccess"
          START=$(date +%s)
          PASS=0
          while true; do
            NOW=$(date +%s)
            ELAPSED_MIN=$(( (NOW - START) / 60 ))
            if [ "$ELAPSED_MIN" -ge "$LOOP_MINUTES" ]; then
              echo "loop budget spent after $PASS passes"; break
            fi
            PASS=$((PASS + 1))
            T0=$(date +%s)
            mkdir -p output
            # Day 0 every pass; days 0-3 every FULL_EVERY passes. `--days 1`
            # is still a UNION of local todays, so near a date boundary it
            # correctly yields two dates (Denver has ticked over while Phoenix
            # has not) — this is not "one date", it is "today, everywhere".
            #
            # The full pass covers 0-3 rather than 1-3 on purpose: day 0 is
            # scraped first either way, so its stamp is refreshed at the top of
            # every pass.
            #
            # `-eq 0`, so the full sweep lands on passes 4, 8, 12 — NOT on pass
            # 1. PASS resets to 0 at the start of every run, and this loop
            # self-chains every ~5.5h and restarts after any crash or cancel.
            # With `-eq 1` every run opened with a ~2h full sweep before day 0
            # got its fast cadence, which spends two thirds of day 0's 3h grace
            # at precisely the moment it is most likely to be stale. Now a run
            # opens with three quick day-0 passes and day 0 is refreshed within
            # ~30-40 min of any restart. Days 1-3 drop to roughly every 3.5h,
            # comfortably inside their 6h grace.
            #
            # The `-le 1` guard is load-bearing, not decoration: FULL_EVERY=0
            # would make $(( PASS % FULL_EVERY )) a division-by-zero error.
            if [ "$FULL_EVERY" -le 1 ] || [ $(( PASS % FULL_EVERY )) -eq 0 ]; then
              WINDOW=4
            else
              WINDOW=1
            fi
            DATES=$(python -m scraper.dates --registry registry.json --days "$WINDOW")
            CSV=$(echo "$DATES" | paste -sd, -)
            echo "pass ${PASS}: window=${WINDOW} day(s) -> $(echo "$DATES" | paste -sd' ' -)"
            run_platform () {
              PLAT="$1"
              case "$PLAT" in
                clubcaddie)
                  # clubcaddie takes a RANGE in one widget-load-per-course call
                  # and writes output/cc_<date>.json per date.
                  D0=$(echo "$DATES" | head -1)
                  echo "::group::clubcaddie near pass ${PASS}"
                  python -m scraper.browser_clubcaddie --date "$D0" --days "$WINDOW" --out-dir output || true
                  for DATE in $DATES; do
                    python -m scraper.d1 push --data "output/cc_${DATE}.json" || true
                  done
                  echo "::endgroup::"
                  ;;
                cps)
                  # Batched: one Chromium session per tenant covers all dates.
                  echo "::group::cps (plain) near pass ${PASS}"
                  python -m scraper.browser_cps --dates "$CSV" --out-dir output --registry registry.json || true
                  for DATE in $DATES; do
                    python -m scraper.d1 push --data "output/cps_${DATE}.json" || true
                  done
                  echo "::endgroup::"
                  ;;
                *)
                  case "$PLAT" in
                    ezlinks)         MOD=browser_ezlinks;        PFX=ez  ;;
                    golfnow)         MOD=browser_golfnow;        PFX=gn  ;;
                    supersaas)       MOD=browser_supersaas;      PFX=ss  ;;
                    golfwithaccess)  MOD=browser_golfwithaccess; PFX=gwa ;;
                  esac
                  for DATE in $DATES; do
                    OUT="output/${PFX}_${DATE}.json"
                    echo "::group::${PLAT} near pass ${PASS} ${DATE}"
                    python -m scraper."$MOD" --date "${DATE}" --out "${OUT}" || true
                    python -m scraper.d1 push --data "${OUT}" || true
                    echo "::endgroup::"
                  done
                  ;;
              esac
            }

            if [ "$BROWSER_LANES" -ge 2 ]; then
              # Lane 1 is golfnow alone, deliberately: it is the slowest
              # platform and the only one measured to degrade under
              # contention. Lane 2 carries the other four, which together
              # cost less than golfnow does.
              #
              # Output is buffered per lane and printed after the join, so
              # the ::group:: markers stay readable instead of interleaving.
              ( run_platform golfnow ) > "lane1.log" 2>&1 &
              L1=$!
              sleep 5                     # stagger the browser launches
              ( for P in ezlinks clubcaddie supersaas golfwithaccess; do
                  run_platform "$P"
                done ) > "lane2.log" 2>&1 &
              L2=$!
              # Capture exit codes explicitly. This catches a lane KILLED
              # outright — OOM, signal, runner eviction — which would otherwise
              # look exactly like a lane that finished quickly. It does NOT
              # catch individual scraper failures: those already end in
              # `|| true` on purpose (one dead platform must not abort the
              # pass) and surface as zero rows plus the landed-zero alert.
              if wait "$L1"; then RC1=0; else RC1=$?; fi
              if wait "$L2"; then RC2=0; else RC2=$?; fi
              cat lane1.log lane2.log; rm -f lane1.log lane2.log
              echo "pass ${PASS}: lanes=2 exit codes lane1=${RC1} lane2=${RC2}"
            else
              for PLAT in $PLATFORMS; do run_platform "$PLAT"; done
            fi
            T1=$(date +%s)
            TOOK=$((T1 - T0))
            SLEEP=$((INTERVAL_SECONDS - TOOK))
            if [ "$SLEEP" -gt 0 ]; then
              echo "pass ${PASS} took ${TOOK}s; sleeping ${SLEEP}s"
              sleep "$SLEEP"
            else
              echo "pass ${PASS} took ${TOOK}s (over interval; no sleep)"
            fi
          done

      - name: Chain the next loop run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scrape-browser-near.yml --ref main --repo "${{ github.repository }}" \
            && echo "successor dispatched" || echo "dispatch failed; cron backstop will restart"
