name: Snapshot onetee-gate from Cloudflare

# onetee-gate has no local wrangler project — it lives only in the Cloudflare
# dashboard, and the dashboard's Quick Edit pane is a cross-origin iframe that
# refuses synthetic mouse and keyboard input, so nothing can drive it but a
# human. That combination has meant the gate's source existed in exactly one
# place, un-versioned, with no diff history and no way to review a change before
# it shipped. ARCHITECTURE notes have referred to "the checked-in
# worker/onetee-gate.js" for a while; this is the job that makes that true.
#
# Read-only against Cloudflare. It pulls the CURRENTLY DEPLOYED script and
# commits it verbatim, so the file is a faithful mirror of production at the
# moment it ran — never a draft, never a guess. Editing the committed copy does
# NOT deploy anything: shipping is still a human pasting into the dashboard and
# clicking Deploy, which is deliberate for the worker that owns billing.
#
# Run it before editing (so the diff is against reality) and after deploying
# (so main matches what is live).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-gate
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the deployed worker
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p worker
          code=$(curl -sS -o /tmp/gate.js -w '%{http_code}' \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/onetee-gate")

          if [ "$code" != "200" ]; then
            echo "::error::Cloudflare returned HTTP $code fetching onetee-gate"
            head -c 400 /tmp/gate.js || true
            exit 1
          fi

          # A JSON body here means the API returned an error envelope rather
          # than the script, and writing that over the master copy would look
          # like the worker had been replaced by an error message.
          if head -c 1 /tmp/gate.js | grep -q '{'; then
            echo "::error::Response is JSON, not worker source — refusing to overwrite"
            head -c 400 /tmp/gate.js
            exit 1
          fi

          bytes=$(wc -c < /tmp/gate.js)
          echo "fetched ${bytes} bytes"
          if [ "$bytes" -lt 10000 ]; then
            echo "::error::Only ${bytes} bytes — the gate is ~28KB, so this is truncated"
            exit 1
          fi

          # Sanity-check that this is the gate and not some other script: the
          # gate is the only worker that owns the free/paid split.
          grep -q 'dateAllowed' /tmp/gate.js || {
            echo "::error::No dateAllowed() in the fetched script — wrong worker?"; exit 1; }

          cp /tmp/gate.js worker/onetee-gate.js

      - name: Commit if it changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- worker/onetee-gate.js; then
            echo "no change — committed copy already matches production"
            exit 0
          fi
          git add worker/onetee-gate.js
          git commit -m "Snapshot onetee-gate as deployed [skip ci]"
          git push
