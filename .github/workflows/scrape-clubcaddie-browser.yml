name: Scrape Club Caddie via browser (0-6 hourly, 0-30 every 8h)

# Club Caddie's public widget is session-gated (plain HTTP gets a stub). A real
# Chromium loads the widget, captures the POST it fires to /webapi/TeeTimes
# (CourseId + apikey + session Interaction), then re-POSTs it per date and
# parses the HTML tee sheet. One widget load per course serves all 3 dates.
# The plain scraper excludes clubcaddie, so this job solely owns those slugs.

# 2026-09-01: moved to the self-hosted runner on the scraper VPS (label
# "scraper"). Same job, your hardware: no 20-slot concurrency cap, no queueing
# behind the near-tier loops, and Chromium/xvfb come preinstalled by
# vps/scraper-host/bootstrap.sh instead of apt-under-sudo per run.
on:
  schedule:
    # SHALLOW, days 0-6. Hourly except the three deep slots below, so the
    # twenty-four-runs-a-day cadence is unchanged.
    - cron: "27 0,1,3,4,5,6,7,8,9,11,12,13,14,15,16,17,19,20,21,22,23 * * *"
    # DEEP, days 0-30. Three slots 8h apart, matched by their exact cron string
    # in the step below. See the long comment there for why.
    - cron: "27 2 * * *"
    - cron: "27 10 * * *"
    - cron: "27 18 * * *"
  workflow_dispatch:
    inputs:
      deep:
        description: "Scrape the full 0-30 day horizon"
        default: "no"
  push:
    branches: [main]
    paths:
      - "registry.json"
      - "scraper/browser_clubcaddie.py"
      - ".github/workflows/scrape-clubcaddie-browser.yml"

permissions:
  contents: read

concurrency:
  group: scrape-clubcaddie-browser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: [self-hosted, linux, scraper]
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium
        run: |
          pip install requests playwright
          python -m playwright install chromium   # deps preinstalled by vps/scraper-host/bootstrap.sh
      - name: Scrape the tiered horizon (one widget load per course) + push each to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          VPS_ONLY: "1"
          ONETEE_API_URL: https://api.oneteeapp.com
          ONETEE_INGEST_TOKEN: ${{ secrets.VPS_INGEST_TOKEN }}
        run: |
          # Hourly runs cover days 0-6; the deep slots stretch to the full
          # 30-day horizon. Browser scrapes are too slow to loop at the near
          # tier's cadence, so the deep slots are the far-tier freshness for
          # this platform. The horizon is computed BEFORE the scrape so the
          # scrape itself covers it, not just the push loop.
          #
          # WHY THIS IS GATED ON github.event.schedule AND NOT ON THE CLOCK.
          # It used to read:
          #     [ "$(date -u +%H)" = "10" ] && DEEP=yes
          # an exact wall-clock hour equality evaluated INSIDE the job, so it
          # only held if the runner reached this line during the 10:00 UTC hour.
          # GitHub delivers scheduled events late under load and sometimes drops
          # a slot outright, and a miss silently costs the whole day's horizon.
          # This platform's 27-past cron landed in hour 10 on only 3 of the 7
          # days to 2026-08-15 — the last one at 10:59, which had almost
          # certainly ticked over to 11 by the time this line ran — so days 7-30
          # aged past the read API's 30h far-freshness cut (FRESH_FAR_MIN in
          # vps/api/server.mjs) and the site stopped serving anything beyond
          # about day 5. The same bug took ~8,000 golfwithaccess tee times off
          # the site on 2026-08-14; see that workflow for the full write-up.
          #
          # github.event.schedule is the cron expression that FIRED, so delivery
          # jitter cannot move a run out of its slot. Three slots 8h apart mean
          # a dropped delivery costs 8 hours instead of a day.
          #
          # Three deep runs a day is affordable HERE specifically because one
          # widget load per course serves the whole date range: the marginal
          # cost of 31 days over 7 is the per-date d1 pushes, not 31 page loads.
          DEEP=no
          case "${{ github.event.schedule }}" in
            "27 2 * * *"|"27 10 * * *"|"27 18 * * *") DEEP=yes ;;
          esac
          [ "${{ github.event.inputs.deep }}" = "yes" ] && DEEP=yes
          LAST=6
          [ "$DEEP" = "yes" ] && LAST=30
          echo "clubcaddie horizon: deep=${DEEP}, days 0-${LAST}"
          DAYS=$((LAST + 1))
          # Day 0 from scraper.dates, not `date -u`: after ~5pm Mountain the
          # UTC date is already tomorrow and a UTC "today" skips the real one.
          START=$(python -m scraper.dates --registry registry.json --days 1 | head -1)
          python -m scraper.browser_clubcaddie --date "${START}" --days "${DAYS}" \
            --out-dir output || true
          for OFFSET in $(seq 0 $LAST); do
            DATE=$(date -d "$START +${OFFSET} days" +%F)
            python -m scraper.d1 push --data "output/cc_${DATE}.json" || true
          done
