name: Scrape EZLinks via browser (0-6 hourly, 0-30 daily)

# EZLinks portals sit behind Cloudflare that blocks the plain HTTP client's TLS
# fingerprint from datacenter IPs. A real headless Chromium clears the *managed*
# JS challenge on its own (no interactive step) and the page's own origin then
# returns full JSON — verified: Aurora 373 slots, Pine Creek 144. The plain
# scraper excludes ezlinks, so this job solely owns those course_slugs in D1.
# Hourly: portal availability isn't as volatile as same-day popular slots, and
# spinning up Chromium every 5 min would be wasteful.

on:
  schedule:
    # Split so the DEEP slots have their own cron STRINGS to match on — a
    # single "47 * * * *" makes every hour indistinguishable to
    # github.event.schedule. Three deep slots, 8h apart.
    - cron: "47 0,1,3,4,5,6,7,8,9,11,12,13,14,15,16,17,19,20,21,22,23 * * *"
    - cron: "47 2 * * *"
    - cron: "47 10 * * *"
    - cron: "47 18 * * *"
  workflow_dispatch:
    inputs:
      deep:
        description: "Scrape the full 0-30 day horizon"
        default: "no"
  push:
    branches: [main]
    paths:
      - "registry.json"
      - "scraper/browser_ezlinks.py"
      - "scraper/adapters/ezlinks.py"
      - ".github/workflows/scrape-ezlinks-browser.yml"

permissions:
  contents: read

concurrency:
  group: scrape-ezlinks-browser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Scrape + push each date to D1 (tiered horizon)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          VPS_ONLY: "1"
          ONETEE_API_URL: https://api.oneteeapp.com
          ONETEE_INGEST_TOKEN: ${{ secrets.VPS_INGEST_TOKEN }}
        run: |
          # Hourly runs cover days 0-6; the deep runs (every 8h at 02/10/18 UTC,
          # or a manual dispatch) stretch to the full 30-day horizon. Browser
          # scrapes are too slow to loop at the near tier's cadence.
          #
          # Two fixes here (2026-08-04): (1) the deep loop is now SHUFFLED. One
          # un-sharded Chromium cannot finish ~80 portals x 31 dates inside the
          # 170-min budget, so an in-ORDER loop always died around day ~14 and
          # the far dates (21-30) were NEVER reached — measured d21/d29 = 0 live.
          # Shuffled, a short run leaves a different gap each time and the union
          # fills the tail. (2) deep now runs every 8h instead of once/day, so
          # each far date is re-hit well within the 30h far-freshness grace.
          DEEP=no
          # WHY THIS MATCHES THE CRON STRING AND NOT THE CLOCK.
          #
          # This gate used to read:
          #     [ "$(date -u +%H)" = "10" ] && DEEP=yes
          # a wall-clock hour equality evaluated INSIDE the job, so it only held
          # if the runner reached this line during that UTC hour. GitHub delivers
          # scheduled events late under load and drops slots outright, and a
          # queued job can start an hour after its slot — so the deep sweep was
          # silently skipped whenever either happened, taking days 7-30 with it.
          # That exact bug cost ~8,000 golfwithaccess tee times on 2026-08-14.
          # github.event.schedule is the cron expression that FIRED, so delivery
          # jitter cannot move a run out of its slot.
          case "${{ github.event.schedule }}" in
            "47 2 * * *"|"47 10 * * *"|"47 18 * * *") DEEP=yes ;;
          esac
          [ "${{ github.event.inputs.deep }}" = "yes" ] && DEEP=yes
          LAST=6
          [ "$DEEP" = "yes" ] && LAST=30
          # Dates from scraper.dates (union of local todays across covered
          # timezones), not `date -u`: after ~5pm Mountain the UTC date is
          # already tomorrow and a UTC "today" skips the real one.
          for DATE in $(python -m scraper.dates --registry registry.json --days "$((LAST + 1))" | shuf); do
            echo "::group::ezlinks browser ${DATE}"
            python -m scraper.browser_ezlinks --date "${DATE}" \
              --out "output/ez_${DATE}.json" || true
            python -m scraper.d1 push --data "output/ez_${DATE}.json" || true
            echo "::endgroup::"
          done
