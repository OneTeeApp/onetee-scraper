name: Scrape EZLinks via browser (0-6 hourly, 0-30 daily)

# EZLinks portals sit behind Cloudflare that blocks the plain HTTP client's TLS
# fingerprint from datacenter IPs. A real headless Chromium clears the *managed*
# JS challenge on its own (no interactive step) and the page's own origin then
# returns full JSON — verified: Aurora 373 slots, Pine Creek 144. The plain
# scraper excludes ezlinks, so this job solely owns those course_slugs in D1.
# Hourly: portal availability isn't as volatile as same-day popular slots, and
# spinning up Chromium every 5 min would be wasteful.

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      deep:
        description: "Scrape the full 0-30 day horizon"
        default: "no"
  push:
    branches: [main]
    paths:
      - "registry.json"
      - "scraper/browser_ezlinks.py"
      - "scraper/adapters/ezlinks.py"
      - ".github/workflows/scrape-ezlinks-browser.yml"

permissions:
  contents: read

concurrency:
  group: scrape-ezlinks-browser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Scrape + push each date to D1 (tiered horizon)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
        run: |
          # Hourly runs cover days 0-6; the 10:xx UTC run (~4am Denver) and a
          # manual deep dispatch stretch to the full 30-day horizon. Browser
          # scrapes are too slow to loop at the near tier's cadence, so daily
          # is the far-tier freshness for these platforms.
          DEEP=no
          [ "$(date -u +%H)" = "10" ] && DEEP=yes
          [ "${{ github.event.inputs.deep }}" = "yes" ] && DEEP=yes
          LAST=6
          [ "$DEEP" = "yes" ] && LAST=30
          for OFFSET in $(seq 0 $LAST); do
            DATE=$(date -u -d "+${OFFSET} days" +%F)
            echo "::group::ezlinks browser ${DATE}"
            python -m scraper.browser_ezlinks --date "${DATE}" \
              --out "output/ez_${DATE}.json" || true
            python -m scraper.d1 push --data "output/ez_${DATE}.json" || true
            echo "::endgroup::"
          done
