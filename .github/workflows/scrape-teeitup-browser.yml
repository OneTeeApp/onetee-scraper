name: Scrape TeeItUp far (days 3-30, plain HTTP via rotating datacenter proxy)

# TRANSPORT (2026-08-06). Plain HTTP to kenna through the Webshare ROTATING
# DATACENTER proxy in secret TEEITUP_DC_PROXY — a new exit IP per request, so
# kenna's per-IP rate limit (~50 req/IP, its only limit) never binds. Validated
# by probe-webshare.yml run #4 (31069125299): 6 far dates, 46/46 served on
# every date, ZERO errors (the no-proxy baseline served only the first date per
# shard per run). History: claude/noproxy-verify-log.md.
#
# Residential is deliberately NOT used here (it was burning $5 in hours and is
# not needed — kenna doesn't block datacenter IPs, it rate-limits per IP).
# TEEITUP_DC_PROXY must be the ROTATING endpoint, never a direct proxy IP. If
# the secret is unset, this falls back to a direct connection (per-IP wall
# returns → partial coverage, not zero).
#
# OWNERSHIP. This job owns days 3-30 for teeitup; scrape-teeitup-browser-near.yml
# owns days 0-2. scrape-far.yml, scrape.yml (mid) AND scrape-near.yml all EXCLUDE
# teeitup, so no plain tier ever writes the same course_slug+date and clobbers
# it in D1.

# 2026-09-01: moved to the self-hosted runner on the scraper VPS (label
# "scraper"). Same job, your hardware: no 20-slot concurrency cap, no queueing
# behind the near-tier loops, and Chromium/xvfb come preinstalled by
# vps/scraper-host/bootstrap.sh instead of apt-under-sudo per run.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Ignore booking windows (full sweep + re-derive)"
        default: "no"
  push:
    branches: [main]
    paths:
      - "scraper/browser_teeitup.py"
      - "scraper/adapters/teeitup.py"
      - ".github/workflows/scrape-teeitup-browser.yml"

permissions:
  contents: write        # the derive-windows job commits booking-windows.json

concurrency:
  group: scrape-teeitup-browser
  cancel-in-progress: false

jobs:
  plan:
    # ONE mode decision for the whole run, consumed by every shard AND by the
    # derivation, so they can never disagree. Copied from scrape-far.yml, which
    # learned this the hard way: when each job judged the clock for itself, a
    # derive step that drifted past the hour boundary committed WINDOWED output
    # as full-sweep evidence.
    #
    # Full once a day. This is not a nicety — a windowed sweep only looks where
    # the windows already point, so deriving from one would let each day's
    # windows shrink to fit the previous day's pruning, and a course that widens
    # its booking window could never be rediscovered. The full sweep is the only
    # thing that can grow a window back.
    runs-on: [self-hosted, linux, scraper]
    timeout-minutes: 5
    outputs:
      full: ${{ steps.mode.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide full vs windowed
        id: mode
        env:
          INPUT_FULL: ${{ github.event.inputs.full }}
        run: |
          FULL=no
          W=probe-results/booking-windows.json
          if [ ! -f "$W" ]; then
            FULL=yes                       # no windows at all: must derive
          elif [ "$(date -u +%H)" -ge 10 ]; then
            # >= 10:00 UTC is ~04:00 Denver, which is where scrape-far.yml puts
            # its full sweep and why. A full sweep costs roughly double a
            # windowed one (~20 min against ~9), and the first version of this
            # gate fired on the bare UTC date rollover — 18:00 Denver, the
            # busiest hour for booking and the worst possible time to double the
            # load on kenna. Same stamp, same retry behaviour, civilised hour.
            AS_OF=$(python3 -c "import json;print((json.load(open('$W')).get('sources',{}).get('teeitup-far',{})).get('as_of',''))" 2>/dev/null || echo "")
            [ "$AS_OF" != "$(date -u +%F)" ] && FULL=yes
          fi
          [ "${INPUT_FULL}" = "yes" ] && FULL=yes
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "teeitup far sweep mode: full=${FULL}"

  scrape:
    needs: plan
    runs-on: [self-hosted, linux, scraper]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]   # 8 shards = 8 free runner IPs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests      # plain HTTP only — no Chromium needed

      - name: Scrape far teeitup (plain HTTP, no proxy) + push each date to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          VPS_ONLY: "1"
          ONETEE_API_URL: https://api.oneteeapp.com
          ONETEE_INGEST_TOKEN: ${{ secrets.VPS_INGEST_TOKEN }}
          # Rotating DATACENTER proxy (Webshare). Kenna doesn't block datacenter
          # IPs, only rate-limits per IP, which per-request rotation defeats — the
          # cheapest working transport. 2026-08-10: BOTH proxy secrets were dead
          # (DC ProxyError, residential Max-retries), so teeitup went dark. RENEW
          # this DC plan and teeitup recovers with NO code change. JSON-only.
          TEEITUP_PROXY: ${{ secrets.TEEITUP_DC_PROXY }}
          TEEITUP_PLAIN_HTTP: "1"
          TEEITUP_PLAIN_CONCURRENCY: "4"   # rotation spreads IPs; keep bursts modest
          TEEITUP_PLAIN_GAP_MS: "150"      # small jitter so we don't micro-burst kenna
        run: |
          # Shuffle the date order too: spreads which dates a short/interrupted
          # run covers so the union fills the 3-30 window over a few sweeps.
          for DATE in $(python -m scraper.dates --registry registry.json --start 3 --days 28 | shuf); do
            OUT="output/tu_${DATE}_s${{ matrix.shard }}.json"
            # Windowed sweeps ask each course only about days it has actually
            # published on, plus the file's grace margin. Measured 2026-08-14:
            # 384 courses asked on all 28 days, against 167 with rows at day +8,
            # 72 at +16 and 62 at +25 — about half of every sweep spent on
            # questions the platform has already answered with "not open yet".
            #
            # eligible_courses.py fails OPEN in every direction that matters: an
            # unknown course, an offset beyond what the sweep ever checked, a
            # missing file and a stale stamp all print ALL. --source makes the
            # staleness judgement teeitup's own, so a stalled PLAIN far tier
            # cannot silently disable this and a stalled teeitup tier cannot
            # keep pruning on windows nobody has refreshed.
            ARGS=""
            if [ "${{ needs.plan.outputs.full }}" != "yes" ]; then
              ELIG=$(python scripts/eligible_courses.py --date "${DATE}" \
                       --platform teeitup --source teeitup-far)
              if [ "$ELIG" = "NONE" ]; then
                echo "skip ${DATE}: no teeitup booking window reaches it"
                continue
              fi
              [ "$ELIG" != "ALL" ] && ARGS="--courses ${ELIG}"
            fi
            echo "::group::teeitup plain ${DATE} shard ${{ matrix.shard }}"
            python -m scraper.browser_teeitup --date "${DATE}" \
              --shard "${{ matrix.shard }}/8" --out "${OUT}" ${ARGS} || true
            python -m scraper.d1 push --data "${OUT}" || true
            echo "::endgroup::"
          done

      - name: Upload sweep outputs (booking-window derivation)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teeitup-far-${{ github.run_id }}-s${{ matrix.shard }}
          path: output/tu_*.json
          retention-days: 3

  derive-windows:
    # LEARNING ONLY — this job changes nothing about what gets scraped. It
    # records how far out each teeitup course actually publishes, so the far
    # loop can later stop asking 384 courses about days nothing answers on.
    #
    # WHY IT DID NOT EXIST. scrape-far.yml derives booking windows, but it
    # EXCLUDES teeitup (and every other browser-owned platform) because
    # separate workflows own them. The result, measured 2026-08-14: 892 of
    # 1,158 courses had no window recorded at all, every browser platform
    # among them, and eligible_courses.py reads an unknown course as "scrape
    # it". So the pruning existed and could not fire where it mattered most.
    # Live inventory says teeitup has 167 courses with rows at day +8, 141 at
    # +12, 72 at +16 and 62 at +25 — against 384 asked on every one of days
    # 3-30, every two hours.
    #
    # --merge keeps this strictly additive: only the slugs this sweep saw are
    # touched, and as_of is left alone because that stamp is scrape-far.yml's
    # own "have I run a full sweep today" flag.
    needs: [plan, scrape]
    if: needs.plan.outputs.full == 'yes' && needs.scrape.result == 'success'
    runs-on: [self-hosted, linux, scraper]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download sweep outputs
        uses: actions/download-artifact@v4
        with:
          pattern: teeitup-far-${{ github.run_id }}-*
          path: output
          merge-multiple: true
      - name: Derive + merge + commit
        run: |
          python scripts/derive_windows.py \
            --outputs 'output/tu_*.json' \
            --registry registry.json \
            --out probe-results/booking-windows.json \
            --merge --source teeitup-far
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe-results/booking-windows.json
          git diff --cached --quiet && { echo "windows unchanged"; exit 0; }
          git commit -m "Booking windows: teeitup far sweep [skip ci]"
          # RE-DERIVE ONTO LATEST rather than rebase. On 2026-08-15 this file was
          # rewritten wholesale by the other contributor between derive and push;
          # `git pull --rebase` hit a conflict, left the runner mid-rebase on a
          # detached HEAD with unmerged files, and every retry then failed with
          # "Pulling is not possible because you have unmerged files". The job
          # went red and the windows were lost for the day.
          #
          # Merge-mode derivation is idempotent and only touches this
          # contributor's own slugs, so the safe recovery is to throw the local
          # commit away, take the other side's file whole, and re-apply our
          # slugs on top. No conflict is possible because we never ask git to
          # reconcile the JSON.
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "push rejected (attempt $i) — re-deriving onto the latest main"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python scripts/derive_windows.py \
              --outputs 'output/tu_*.json' \
              --registry registry.json \
              --out probe-results/booking-windows.json \
              --merge --source teeitup-far
            git add probe-results/booking-windows.json
            git diff --cached --quiet && { echo "nothing to add after re-derive"; exit 0; }
            git commit -m "Booking windows: teeitup far sweep [skip ci]"
          done
          exit 1
