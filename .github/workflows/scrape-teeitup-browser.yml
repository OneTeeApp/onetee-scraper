name: Scrape TeeItUp via browser (days 3-30, every 2 hours)

# TRANSPORT NOTE (2026-08-04). This job uses the headless-Chromium transport
# NOT because kenna fingerprint-throttles (it does not — probe-kenna-impersonate
# proved plain `requests` == curl_cffi byte-for-byte per call). It uses the
# browser because the browser's per-fetch page overhead paces kenna gently, and
# kenna rate-limits the WHOLE teeitup fleet off one host when hit too fast. The
# NEAR window (days 0-2) moved to a plain-HTTP loop for freshness
# (scrape-teeitup-browser-near.yml); this job keeps the wider MID+FAR window
# (days 3-30) on the browser so the two teeitup jobs together stay under kenna's
# burst limit. If a future change proves plain HTTP can cover 3-30 without
# tripping 429s, swap this to scraper.aggregate --platforms teeitup.
#
# OWNERSHIP. This job owns days 3-30 for teeitup; scrape-teeitup-browser-near.yml
# owns days 0-2. scrape-far.yml, scrape.yml (mid) AND scrape-near.yml all EXCLUDE
# teeitup, so no plain tier ever writes the same course_slug+date as a teeitup
# job and clobbers it in D1, and nothing else contends on the kenna host.

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper/browser_teeitup.py"
      - "scraper/adapters/teeitup.py"
      - ".github/workflows/scrape-teeitup-browser.yml"

permissions:
  contents: read

concurrency:
  group: scrape-teeitup-browser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Scrape far teeitup + push each date to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
        run: |
          # Shuffle the date order: spreads which dates a short/interrupted run
          # covers so the union fills the 3-30 window over a few sweeps.
          for DATE in $(python -m scraper.dates --registry registry.json --start 3 --days 28 | shuf); do
            OUT="output/tu_${DATE}_s${{ matrix.shard }}.json"
            echo "::group::teeitup browser ${DATE} shard ${{ matrix.shard }}"
            python -m scraper.browser_teeitup --date "${DATE}" \
              --shard "${{ matrix.shard }}/4" --out "${OUT}" || true
            python -m scraper.d1 push --data "${OUT}" || true
            echo "::endgroup::"
          done
