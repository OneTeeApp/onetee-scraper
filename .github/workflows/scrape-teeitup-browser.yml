name: Scrape TeeItUp via browser (RETIRED — manual dispatch only)

# RETIRED 2026-08-04. This job existed to clear a kenna "TLS-fingerprint
# throttle" on far dates by firing kenna from inside a headless Chromium page.
# That throttle was DISPROVEN by probe-kenna-impersonate: plain `requests` and
# curl_cffi (Chrome-impersonated TLS) returned byte-identical slot counts from
# the same Actions data-center IP at every horizon (raccoon far 47/47, riverdale
# far 0/0). The far-date zeros are real booking-window closures, not throttling.
#
# teeitup mid+far (days 3-30) is now covered by the plain, WINDOWED tiers that
# every other platform uses — scrape.yml (mid, days 3-7, hourly) and
# scrape-far.yml (days 8-30, every 2h) — which no longer exclude teeitup. Those
# tiers skip dates a course has proven it does not publish (booking-windows.json
# via eligible_courses.py), so they are strictly more efficient than this job's
# every-date-every-run full sweep, and they install no Chromium. teeitup near
# (days 0-2) is owned by scrape-teeitup-browser-near.yml, now also plain HTTP.
#
# Left here as a manual escape hatch ONLY: if kenna ever genuinely starts
# fingerprint-throttling the data-center client, dispatch this to fetch teeitup
# through a real browser again. It is not scheduled and will not run on its own.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrape-teeitup-browser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Scrape far teeitup + push each date to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
        run: |
          for DATE in $(python -m scraper.dates --registry registry.json --start 3 --days 28 | shuf); do
            OUT="output/tu_${DATE}_s${{ matrix.shard }}.json"
            echo "::group::teeitup browser ${DATE} shard ${{ matrix.shard }}"
            python -m scraper.browser_teeitup --date "${DATE}" \
              --shard "${{ matrix.shard }}/4" --out "${OUT}" || true
            python -m scraper.d1 push --data "${OUT}" || true
            echo "::endgroup::"
          done
