name: Probe residential proxy diagnostic (why don't challenged cps tenants clear?)

# Read-only. Tests secret TEEITUP_PROXY (the RESIDENTIAL proxy the cps browser
# path uses) in three isolated stages: (1) endpoint/auth as-is, (2) the
# provider-aware sticky-session username browser_cps builds, (3) a real
# Chromium against one challenged tenant (fossiltrace) through the exact
# production launch path. Full exceptions printed; credentials masked.
#
# Context 2026-08-06: the residential secret was refunded (Webshare
# residential) but run #107 left all ~20 challenged tenants dark. This
# pinpoints which stage breaks: proxy auth, sticky syntax, or Cloudflare.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: residential proxy diagnostic
        env:
          TEEITUP_PROXY: ${{ secrets.TEEITUP_PROXY }}
        run: python -m scraper.probe_residential_diag
