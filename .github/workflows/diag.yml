name: Diagnose sub-courses + capture misses

# Live diagnosis for the scripts/diag_*.py probes. Needs no secrets: it only
# reads public booking APIs and writes its findings to probe-results/diag.txt
# for the dev sandbox (which cannot reach those hosts) to pull down.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/diag_subcourses*.py"
      - "scripts/diag_misses.py"
      - "scripts/diag4.py"
      - ".github/workflows/diag.yml"

permissions:
  contents: write

concurrency:
  group: diag
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4

      - name: Probe
        run: |
          mkdir -p probe-results
          python scripts/diag4.py 2>&1 | tee probe-results/diag4.txt

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results/diag2.txt probe-results/diag3.txt probe-results/diag4.txt
          git commit -m "diag: sub-courses + capture misses [skip ci]" || exit 0
          # Retry: other workflows commit to probe-results/ too, and losing the
          # race used to fail the job and throw away the results.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "could not push diag results after 5 attempts"; exit 1
