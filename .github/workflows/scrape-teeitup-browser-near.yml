name: Scrape TeeItUp near (days 0-2, self-chaining loop, browser transport)

# TRANSPORT DECISION (2026-08-04, after two plain-HTTP attempts).
# probe-kenna-impersonate proved kenna has no per-CALL TLS-fingerprint throttle
# (plain == curl_cffi for a few courses). BUT at full-fleet scale (365 teeitup
# courses x 3 near dates) the data-center plain client trips kenna's per-host
# BURST/RATE limit and gets a sustained wall of HTTP 429s. Gentling the pacing
# (single-flight, 1.2s*shards gap) reduced but did NOT clear it: raccoon-creek's
# single 2026-08-05 10:37 slot kept getting 429'd on its own date-call and, with
# no prior D1 row, stayed 0 on the live site while kenna still served it.
#
# browser_teeitup fires kenna from INSIDE a live *.book.teeitup.com page
# (page.evaluate → JS fetch, real Chromium, legitimate Origin/Referer). kenna
# does not rate-limit that the way it does the bare data-center client — the
# far browser job lands raccoon reliably at +4/+6/+16. So the NEAR window uses
# the same browser transport. Accuracy beats the Chromium-install cost, which a
# self-chaining loop amortises: Chromium installs ONCE per ~5.5h run, then the
# loop does many browser passes, instead of installing on every 30-min cron fire.
#
# CADENCE. Self-chaining (shard 0 dispatches the successor); the hourly cron is
# only a crash backstop. This is what fixes the original reliability bug — the
# 30-min GitHub cron that silently stopped firing and hid raccoon in the first
# place. The plain near/mid/far tiers all EXCLUDE teeitup, and the browser far
# job owns days 3-30, so days 0-2 have exactly one teeitup writer here.

on:
  schedule:
    - cron: "3 * * * *"        # backstop/successor — self-chain is primary
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper/browser_teeitup.py"
      - "scraper/adapters/teeitup.py"
      - ".github/workflows/scrape-teeitup-browser-near.yml"

permissions:
  contents: read
  actions: write             # shard 0 chains the next run

concurrency:
  group: scrape-teeitup-near
  cancel-in-progress: false     # queued successor waits; never kill the loop

env:
  INTERVAL_SECONDS: 300         # min seconds per pass; a browser pass usually
                                # exceeds this, so passes run back-to-back
  LOOP_MINUTES: 315             # stop looping after this; job timeout is 335

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 335
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium (once per run)
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Loop shard ${{ matrix.shard }}/4 teeitup (browser) over days 0-2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          # Residential proxy so kenna doesn't block the data-center Chromium.
          # Unset = direct (unchanged); browser_teeitup passes it to launch(proxy=).
          TEEITUP_PROXY: ${{ secrets.TEEITUP_PROXY }}
        run: |
          START=$(date +%s)
          PASS=0
          while true; do
            NOW=$(date +%s)
            ELAPSED_MIN=$(( (NOW - START) / 60 ))
            if [ "$ELAPSED_MIN" -ge "$LOOP_MINUTES" ]; then
              echo "loop budget spent after $PASS passes"; break
            fi
            PASS=$((PASS + 1))
            T0=$(date +%s)
            # Only days 0-2 (scraper.dates --days 3). Dates come from
            # scraper.dates (union of local todays across timezones).
            for DATE in $(python -m scraper.dates --registry registry.json --days 3); do
              OUT="output/tun_${DATE}_s${{ matrix.shard }}.json"
              echo "::group::teeitup near browser pass ${PASS} ${DATE} shard ${{ matrix.shard }}"
              python -m scraper.browser_teeitup --date "${DATE}" \
                --shard "${{ matrix.shard }}/4" --out "${OUT}" || true
              python -m scraper.d1 push --data "${OUT}" || true
              echo "::endgroup::"
            done
            T1=$(date +%s)
            TOOK=$((T1 - T0))
            SLEEP=$((INTERVAL_SECONDS - TOOK))
            if [ "$SLEEP" -gt 0 ]; then
              echo "pass ${PASS} took ${TOOK}s; sleeping ${SLEEP}s"
              sleep "$SLEEP"
            else
              echo "pass ${PASS} took ${TOOK}s (over interval; no sleep)"
            fi
          done

      - name: Chain the next loop run (shard 0 only)
        if: always() && matrix.shard == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scrape-teeitup-browser-near.yml --ref main --repo "${{ github.repository }}" \
            && echo "successor dispatched" || echo "dispatch failed; cron backstop will restart"
