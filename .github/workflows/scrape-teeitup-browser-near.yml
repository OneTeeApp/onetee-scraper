name: Scrape TeeItUp near (days 0-2, self-chaining loop, plain HTTP no proxy)

# TRANSPORT (2026-08-05). Plain HTTP straight to kenna from the runners, NO
# proxy — same as the far job. The no-proxy probe (run 30972618625,
# claude/noproxy-probe.md) proved the datacenter reaches kenna fine (zero
# connection errors); kenna's only limit is a per-IP RATE limit (~53% of a
# shard served per gentle pass, rest 429). The residential proxy was burning $5
# in hours and is NOT needed — kenna doesn't block datacenter IPs.
#
# HOW COVERAGE STILL HOLDS. Two things fill the ~half that 429s each pass:
# (1) browser_teeitup's plain path shuffles course order per run, so the 429'd
# tail rotates instead of being a permanent gap; (2) this is a self-chaining
# LOOP doing many passes over ~5.5h, so the union across passes covers the whole
# shard and each course refreshes every ~2 passes — well inside the near
# freshness window (day0=3h, days1-2=6h). A 429 is an error record, so a course
# keeps its existing D1 rows (shown) until a later pass refreshes it.
#
# CADENCE. Self-chaining (shard 0 dispatches the successor); the hourly cron is
# only a crash backstop. The plain near/mid/far tiers all EXCLUDE teeitup, and
# the far job owns days 3-30, so days 0-2 have exactly one teeitup writer here.
#
# To go higher-yield later, add a CHEAP unmetered DATACENTER proxy via
# TEEITUP_PROXY (never residential).

on:
  schedule:
    - cron: "3 * * * *"        # backstop/successor — self-chain is primary
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper/browser_teeitup.py"
      - "scraper/adapters/teeitup.py"
      - ".github/workflows/scrape-teeitup-browser-near.yml"

permissions:
  contents: read
  actions: write             # shard 0 chains the next run

concurrency:
  group: scrape-teeitup-near
  cancel-in-progress: false     # queued successor waits; never kill the loop

env:
  INTERVAL_SECONDS: 300         # min seconds per pass; a plain pass (3 dates)
                                # usually exceeds this, so passes run back-to-back
  LOOP_MINUTES: 315             # stop looping after this; job timeout is 335

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 335
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]     # 4 shards = 4 free runner IPs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests      # plain HTTP only — no Chromium needed

      - name: Loop shard ${{ matrix.shard }}/4 teeitup (plain HTTP) over days 0-2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          # NO TEEITUP_PROXY → direct datacenter connection (the point: free).
          TEEITUP_PLAIN_HTTP: "1"
          TEEITUP_PLAIN_CONCURRENCY: "1"   # single-flight per IP (gentle)
          TEEITUP_PLAIN_GAP_MS: "1200"     # ~0.6s avg jitter between courses
        run: |
          START=$(date +%s)
          PASS=0
          while true; do
            NOW=$(date +%s)
            ELAPSED_MIN=$(( (NOW - START) / 60 ))
            if [ "$ELAPSED_MIN" -ge "$LOOP_MINUTES" ]; then
              echo "loop budget spent after $PASS passes"; break
            fi
            PASS=$((PASS + 1))
            T0=$(date +%s)
            # Only days 0-2 (scraper.dates --days 3). Dates come from
            # scraper.dates (union of local todays across timezones).
            for DATE in $(python -m scraper.dates --registry registry.json --days 3); do
              OUT="output/tun_${DATE}_s${{ matrix.shard }}.json"
              echo "::group::teeitup near plain pass ${PASS} ${DATE} shard ${{ matrix.shard }}"
              python -m scraper.browser_teeitup --date "${DATE}" \
                --shard "${{ matrix.shard }}/4" --out "${OUT}" || true
              python -m scraper.d1 push --data "${OUT}" || true
              echo "::endgroup::"
            done
            T1=$(date +%s)
            TOOK=$((T1 - T0))
            SLEEP=$((INTERVAL_SECONDS - TOOK))
            if [ "$SLEEP" -gt 0 ]; then
              echo "pass ${PASS} took ${TOOK}s; sleeping ${SLEEP}s"
              sleep "$SLEEP"
            else
              echo "pass ${PASS} took ${TOOK}s (over interval; no sleep)"
            fi
          done

      - name: Chain the next loop run (shard 0 only)
        if: always() && matrix.shard == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scrape-teeitup-browser-near.yml --ref main --repo "${{ github.repository }}" \
            && echo "successor dispatched" || echo "dispatch failed; cron backstop will restart"
