name: Scrape TeeItUp near via browser (days 0-2, every 30 min)

# WHY. kenna soft-throttles our data-center client — and NOT only at the far
# horizon. Proven live 2026-08-04 for commonground-golf-course (Aurora CO):
# kenna's real Wed sheet was 9 eighteen-hole slots (11:50, 12:00, 14:50, 15:00,
# 16:30, 17:50, 18:10, 18:20, 18:30), but the plain NEAR tier's D1 rows for that
# day were stale — 9 phantom afternoon slots kenna no longer offered plus the 4
# real morning/early slots missing. The browser-owned next day (d+3) matched
# kenna exactly, so the browser transport is accurate and the plain near tier is
# the stale one. So the browser now owns the NEAR window too; the plain near
# tier (scrape-near.yml) EXCLUDES teeitup.
#
# WHY A SEPARATE JOB. Near dates need frequent refresh (same-day bookings move
# fast; the read-path freshness guard hides near slots older than 90 min). The
# far job runs every 2h, which would let near slots flicker off between runs.
# This job does only days 0-2 — cheap, because browser_teeitup does one page
# load then kenna API calls for the whole fleet cross-alias — so it can run
# every 30 min and keep near inventory inside the freshness grace.

on:
  schedule:
    - cron: "3,33 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper/browser_teeitup.py"
      - "scraper/adapters/teeitup.py"
      - ".github/workflows/scrape-teeitup-browser-near.yml"

permissions:
  contents: read

concurrency:
  group: scrape-teeitup-browser-near
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Scrape near teeitup + push each date to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
        run: |
          # Only days 0-2 (scraper.dates --days 3), in order — just 3 dates, so
          # every run covers all of them; no shuffle needed. Dates come from
          # scraper.dates (union of local todays across timezones), not `date -u`.
          for DATE in $(python -m scraper.dates --registry registry.json --days 3); do
            OUT="output/tun_${DATE}_s${{ matrix.shard }}.json"
            echo "::group::teeitup near browser ${DATE} shard ${{ matrix.shard }}"
            python -m scraper.browser_teeitup --date "${DATE}" \
              --shard "${{ matrix.shard }}/4" --out "${OUT}" || true
            python -m scraper.d1 push --data "${OUT}" || true
            echo "::endgroup::"
          done
