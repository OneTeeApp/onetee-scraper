name: Scrape TeeItUp near (days 0-3, self-chaining loop, plain HTTP via proxy)

# TRANSPORT (2026-08-06). Plain HTTP to kenna through the Webshare ROTATING
# DATACENTER proxy in secret TEEITUP_DC_PROXY — same as the far job. A new exit
# IP per request means kenna's per-IP rate limit (~50 req/IP, its only limit)
# never binds; probe-webshare.yml run #4 (31069125299) served 46/46 on all 6
# probed dates with ZERO errors. The residential proxy was burning $5 in hours
# and is NOT needed — kenna doesn't block datacenter IPs. History:
# claude/noproxy-verify-log.md.
#
# COVERAGE. With rotation every pass should serve ~the whole shard (no more
# 429'd half). The shuffle + self-chaining loop remain as belt-and-braces: if
# the secret is unset/dead we fall back to direct, where (1) the per-run course
# shuffle rotates the 429'd tail and (2) the union across ~5.5h of passes still
# covers the shard within the near freshness window (day0=3h, days1-2=6h). A
# 429 is an error record, so a course keeps its existing D1 rows until a later
# pass refreshes it.
#
# CADENCE. Self-chaining (shard 0 dispatches the successor); the hourly cron is
# only a crash backstop. The plain near/mid/far tiers all EXCLUDE teeitup, and
# the far job owns days 3-30; the day-3 overlap is idempotent (d1.sync
# reconciles per course_slug+date), so near now covers 0-3 for fresher day-3.
#
# TEEITUP_DC_PROXY must be the ROTATING endpoint, never a direct proxy IP.

on:
  schedule:
    - cron: "3 * * * *"        # backstop/successor — self-chain is primary
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper/browser_teeitup.py"
      - "scraper/adapters/teeitup.py"
      - ".github/workflows/scrape-teeitup-browser-near.yml"

permissions:
  contents: read
  actions: write             # shard 0 chains the next run

concurrency:
  group: scrape-teeitup-near
  cancel-in-progress: false     # queued successor waits; never kill the loop

env:
  INTERVAL_SECONDS: 300         # min seconds per pass; a plain pass (3 dates)
                                # usually exceeds this, so passes run back-to-back
  LOOP_MINUTES: 315             # stop looping after this; job timeout is 335

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 335
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]     # 2 shards (was 4). The ROTATING datacenter proxy gives
                          # a new exit IP PER REQUEST, so per-IP rate limits never
                          # bind regardless of shard count — 4 runner IPs bought
                          # nothing. Halving to 2 frees 2 continuously-pinned
                          # hosted runners (the pool was starved — see the
                          # scrape-browser-near.yml 2026-08-06 note). Each shard
                          # now covers 1/2 the courses per pass (~2x pass time,
                          # still minutes, well inside the 3h/6h near grace).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests      # plain HTTP only — no Chromium needed

      - name: Loop shard ${{ matrix.shard }}/2 teeitup (plain HTTP) over days 0-3
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          VPS_ONLY: "1"
          ONETEE_API_URL: https://api.oneteeapp.com
          ONETEE_INGEST_TOKEN: ${{ secrets.VPS_INGEST_TOKEN }}
          # Rotating DATACENTER proxy (Webshare). Kenna doesn't block datacenter
          # IPs, only rate-limits per IP, which per-request rotation defeats — the
          # cheapest working transport. 2026-08-10: BOTH proxy secrets were dead
          # (DC ProxyError, residential Max-retries), so teeitup went dark. RENEW
          # this DC plan and teeitup recovers with NO code change. JSON-only.
          TEEITUP_PROXY: ${{ secrets.TEEITUP_DC_PROXY }}
          TEEITUP_PLAIN_HTTP: "1"
          TEEITUP_PLAIN_CONCURRENCY: "4"   # rotation spreads IPs; keep bursts modest
          TEEITUP_PLAIN_GAP_MS: "150"      # small jitter so we don't micro-burst kenna
        run: |
          START=$(date +%s)
          PASS=0
          while true; do
            NOW=$(date +%s)
            ELAPSED_MIN=$(( (NOW - START) / 60 ))
            if [ "$ELAPSED_MIN" -ge "$LOOP_MINUTES" ]; then
              echo "loop budget spent after $PASS passes"; break
            fi
            PASS=$((PASS + 1))
            T0=$(date +%s)
            # Days 0-3 (scraper.dates --days 4). Dates come from
            # scraper.dates (union of local todays across timezones).
            for DATE in $(python -m scraper.dates --registry registry.json --days 4); do
              OUT="output/tun_${DATE}_s${{ matrix.shard }}.json"
              echo "::group::teeitup near plain pass ${PASS} ${DATE} shard ${{ matrix.shard }}"
              python -m scraper.browser_teeitup --date "${DATE}" \
                --shard "${{ matrix.shard }}/2" --out "${OUT}" || true
              python -m scraper.d1 push --data "${OUT}" || true
              echo "::endgroup::"
            done
            T1=$(date +%s)
            TOOK=$((T1 - T0))
            SLEEP=$((INTERVAL_SECONDS - TOOK))
            if [ "$SLEEP" -gt 0 ]; then
              echo "pass ${PASS} took ${TOOK}s; sleeping ${SLEEP}s"
              sleep "$SLEEP"
            else
              echo "pass ${PASS} took ${TOOK}s (over interval; no sleep)"
            fi
          done

      - name: Chain the next loop run (shard 0 only)
        if: always() && matrix.shard == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scrape-teeitup-browser-near.yml --ref main --repo "${{ github.repository }}" \
            && echo "successor dispatched" || echo "dispatch failed; cron backstop will restart"
