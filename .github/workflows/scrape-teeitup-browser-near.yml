name: Scrape TeeItUp near (days 0-2, 5-minute loop, plain HTTP)

# WHY PLAIN HTTP (was headless Chromium). The TLS-fingerprint throttle theory
# that once justified a browser transport for teeitup was DISPROVEN on
# 2026-08-04. A CI probe (probe-kenna-impersonate) fired plain `requests` vs
# curl_cffi (Chrome-impersonated TLS) against kenna from the SAME Actions
# data-center IP, for commonground / raccoon-creek / riverdale at NEAR and FAR
# dates. The slot counts were byte-identical in every cell — raccoon far 47/47,
# riverdale far 0/0, commonground near 6/6. kenna does NOT throttle by TLS
# fingerprint. The far-date zeros are genuine booking-window closures, not a
# throttle: riverdale +14 returned 0 from a residential IP too. So the browser
# bought nothing but a Chromium install every run and an unreliable 30-min
# GitHub cron that stalled — which is exactly how raccoon-creek's single live
# 10:37 slot went missing. teeitup now rides the same fast plain-HTTP path as
# every other platform, via scraper.aggregate --platforms teeitup.
#
# WHY ITS OWN LOOP (not merged into scrape-near.yml). teeitup's kenna request
# volume is paced and tuned INDEPENDENTLY here: if kenna ever starts 429ing,
# raise INTERVAL_SECONDS in this file without slowing the other near platforms.
# scrape-near.yml still EXCLUDES teeitup, so days 0-2 have exactly one teeitup
# writer and nothing clobbers it in D1.
#
# CADENCE. Same self-chaining trick as scrape-near.yml: GitHub cron cannot
# deliver a real 5-minute beat (measured ~5h between */5 firings in this repo),
# so one long run LOOPS internally every INTERVAL_SECONDS and shard 0 dispatches
# the successor. The hourly cron is only a crash backstop.

on:
  schedule:
    - cron: "3 * * * *"        # backstop/successor — self-chain is primary
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper/adapters/teeitup.py"
      - ".github/workflows/scrape-teeitup-browser-near.yml"

permissions:
  contents: read
  actions: write             # shard 0 chains the next run

concurrency:
  group: scrape-teeitup-near
  cancel-in-progress: false     # queued successor waits; never kill the loop

env:
  # 600s target, but a gently-paced full teeitup sweep (single-flight kenna,
  # 1.2s*shards gap — see scraper/adapters/teeitup.py) takes longer than that,
  # so in practice each pass runs back-to-back with no sleep and near data
  # refreshes roughly every pass-length. That is well inside the 90-min read
  # freshness window, and completeness (no 429-dropped courses) matters more
  # than a strict 5-minute beat. Raise this if kenna still 429s.
  INTERVAL_SECONDS: 600         # target cadence per pass (the one knob)
  LOOP_MINUTES: 330             # stop looping after this; job timeout is 350

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Loop shard ${{ matrix.shard }}/4 teeitup over days 0-2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
        run: |
          START=$(date +%s)
          PASS=0
          while true; do
            NOW=$(date +%s)
            ELAPSED_MIN=$(( (NOW - START) / 60 ))
            if [ "$ELAPSED_MIN" -ge "$LOOP_MINUTES" ]; then
              echo "loop budget spent after $PASS passes"; break
            fi
            PASS=$((PASS + 1))
            T0=$(date +%s)
            # Only days 0-2 (scraper.dates --days 3), teeitup only. Dates come
            # from scraper.dates (union of local todays across timezones).
            for DATE in $(python -m scraper.dates --registry registry.json --days 3); do
              OUT="output/tun_${DATE}_s${{ matrix.shard }}.json"
              echo "::group::teeitup near pass ${PASS} ${DATE} shard ${{ matrix.shard }}"
              python -m scraper.aggregate --date "${DATE}" --workers 10 \
                --platforms teeitup \
                --shard "${{ matrix.shard }}/4" \
                --out "${OUT}" || true
              python -m scraper.d1 push --data "${OUT}" || true
              echo "::endgroup::"
            done
            T1=$(date +%s)
            TOOK=$((T1 - T0))
            SLEEP=$((INTERVAL_SECONDS - TOOK))
            if [ "$SLEEP" -gt 0 ]; then
              echo "pass ${PASS} took ${TOOK}s; sleeping ${SLEEP}s"
              sleep "$SLEEP"
            else
              echo "pass ${PASS} took ${TOOK}s (over interval; no sleep)"
            fi
          done

      - name: Chain the next loop run (shard 0 only)
        if: always() && matrix.shard == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scrape-teeitup-browser-near.yml --ref main --repo "${{ github.repository }}" \
            && echo "successor dispatched" || echo "dispatch failed; cron backstop will restart"
