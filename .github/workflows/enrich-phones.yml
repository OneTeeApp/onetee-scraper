name: Enrich directory phone numbers

# Reads each course's OWN public website and records the pro shop number, so
# a "call to book" tag ships with something to call.
#
# Runs here rather than anywhere else because it touches ~450 third-party
# hosts one at a time with a delay, which is slow by design and needs to be
# polite about it. Monthly is the right cadence: a golf course changes its
# phone number roughly never, and re-asking every host weekly would be rude
# for no benefit.
#
# Public pages only, GET only, no logins. A host that answers with a bot
# challenge is skipped and counted — see scripts/enrich_phones.py.

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Limit to states, e.g. AZ or AZ,CO (blank = all)"
        default: ""
      refresh:
        description: "Re-check courses we already have a number for"
        type: boolean
        default: false
      delay:
        description: "Seconds between requests"
        default: "1.5"
  schedule:
    - cron: "23 7 1 * *"        # 1st of the month

permissions:
  contents: write

concurrency:
  group: enrich-phones
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 330        # ~450 sites x up to 6 pages x 1.5s, worst case
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Build the directory
        run: python3 build_directory.py

      - name: Look up phone numbers
        run: |
          python3 scripts/enrich_phones.py \
            ${{ github.event.inputs.states && format('--states {0}', github.event.inputs.states) || '' }} \
            ${{ github.event.inputs.refresh == 'true' && '--refresh' || '' }} \
            --delay "${{ github.event.inputs.delay || '1.5' }}" \
            2>&1 | tee phones.log

      - name: Rebuild the directory with the numbers folded in
        run: python3 build_directory.py

      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 5 phones.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local/phones.json directory.json
          git commit -m "Directory phone numbers [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "could not push phone numbers after 5 attempts"; exit 1
