name: Enrich directory phone numbers

# Reads each course's OWN public website and records the pro shop number, so
# a "call to book" tag ships with something to call.
#
# Runs here rather than anywhere else because it touches ~450 third-party
# hosts one at a time with a delay, which is slow by design and needs to be
# polite about it. Monthly is the right cadence: a golf course changes its
# phone number roughly never, and re-asking every host weekly would be rude
# for no benefit.
#
# Public pages only, GET only, no logins. A host that answers with a bot
# challenge is skipped and counted — see scripts/enrich_phones.py.
#
# Re-kicked 2026-07-25. The first run produced nothing: local/phones.json was
# still empty and no "Directory phone numbers" commit ever landed. The repo was
# private at the time, and Actions stops running silently once a private repo
# exhausts its included minutes — which an hourly 4-shard scrape does quickly.
# The repo is public again, so minutes are unmetered and this can actually
# finish its 189 sites.

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Limit to states, e.g. AZ or AZ,CO (blank = all)"
        default: ""
      refresh:
        description: "Re-check courses we already have a number for"
        type: boolean
        default: false
      delay:
        description: "Seconds between requests"
        default: "1.5"
  schedule:
    - cron: "23 7 1 * *"        # 1st of the month
  push:
    branches: [main]
    paths:
      # A change to the scoring rules is exactly when the numbers need
      # re-deriving, and it is also the only way to get a first full run
      # without waiting for the 1st of the month.
      - "scripts/enrich_phones.py"
      - ".github/workflows/enrich-phones.yml"

permissions:
  contents: write

concurrency:
  group: enrich-phones
  # Supersede a run in flight. A queued duplicate would re-crawl the same
  # hosts an hour later for the same answers, which is both wasteful and
  # impolite to them.
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Build the directory
        run: python3 build_directory.py

      - name: Look up phone numbers
        # Step-level, so a run that overruns still reaches the commit below
        # with whatever it found. A job-level timeout would cancel the job
        # outright and throw away an hour of deliberately slow crawling.
        timeout-minutes: 90
        run: |
          python3 scripts/enrich_phones.py \
            ${{ github.event.inputs.states && format('--states {0}', github.event.inputs.states) || '' }} \
            ${{ github.event.inputs.refresh == 'true' && '--refresh' || '' }} \
            --delay "${{ github.event.inputs.delay || '1.5' }}" \
            2>&1 | tee phones.log

      - name: Rebuild the directory with the numbers folded in
        # if: always() — and this is the whole reason the first run shipped
        # nothing useful. The lookup step has a 90-minute cap and hit it, so it
        # ended as a failure; without this guard the rebuild was SKIPPED while
        # the commit step (which does say always) went ahead and committed the
        # directory built before the lookup ran. The result looked like a
        # success: local/phones.json arrived with 80 numbers in it and
        # directory.json still had the 5 that came from the CSVs. The numbers
        # were found, crawled for, committed — and then not used.
        #
        # The lookup is deliberately slow and is expected to be cut off
        # sometimes. Whatever it found by then still has to reach the directory.
        if: always()
        run: python3 build_directory.py

      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 5 phones.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The Worker's bundled copy has to go with it: phones land in
          # directory.json, and committing that alone would leave the API
          # serving a directory with no numbers in it. No [skip ci] for the
          # same reason — deploy-worker's worker/** trigger is what ships it.
          git add local/phones.json directory.json worker/directory.gen.js
          git commit -m "Directory phone numbers" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "could not push phone numbers after 5 attempts"; exit 1
