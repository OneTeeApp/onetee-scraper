name: Scrape far tier (days 8-30, every 2 hours)

# The far tier is what makes "book up to 30 days out" true. It is also where
# most of the wasted requests would live: many courses never publish a sheet
# 30 days ahead (Trinidad opens ~2 days out; Teesnap tenants carry advance=14),
# so most passes SKIP the dates a course has proven it does not publish, using
# probe-results/booking-windows.json.
#
# Once a day the sweep goes FULL — every course, every far date, windows
# ignored — and then re-derives the windows file from its own output and
# commits it. That is the self-correcting part: a course that widens its
# booking window is caught within a day, and the derivation costs zero extra
# requests because it reads the sweep's own output documents. Between full
# sweeps the file only trims work; scripts/eligible_courses.py treats unknown
# courses, unchecked offsets, and a stale file as "scrape it" — ignorance
# never reads as absence.
#
# "Once a day" is decided ONCE, in the plan job, from the windows file's own
# as_of stamp: full when the file hasn't been re-derived today and it is past
# 10:00 UTC. It used to be "does this step happen to execute during UTC hour
# 10", checked independently in the shards and again in the derive job — but
# the self-chaining cadence gives no run a guaranteed start hour, so whole
# days could pass with no full sweep, and a windowed sweep whose derive step
# drifted into hour 10-11 could commit windowed output as full-sweep evidence
# (violating the only-shrink-on-full-evidence rule). The as_of rule also
# retries: if a full sweep's derivation fails, as_of stays stale and the next
# run goes full again instead of waiting for tomorrow.

on:
  schedule:
    - cron: "43 */2 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Ignore booking windows (full sweep + re-derive)"
        default: "no"

permissions:
  contents: write               # the full sweep commits booking-windows.json
  actions: write                # the chain job dispatches the next run

concurrency:
  group: scrape-far
  cancel-in-progress: false

jobs:
  plan:
    # ONE mode decision for the whole run — every shard and the derive job
    # consume this output, so they can never disagree with each other.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.mode.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide full vs windowed
        id: mode
        env:
          INPUT_FULL: ${{ github.event.inputs.full }}
        run: |
          FULL=no
          W=probe-results/booking-windows.json
          if [ ! -f "$W" ]; then
            FULL=yes                       # no windows at all: must derive
          elif [ "$(date -u +%H)" -ge 10 ]; then
            # Full once per UTC day, on the first run at/after 10:00 (~4am
            # Denver), judged by the file's own as_of stamp — start-hour
            # drift can't skip it, and a failed derivation retries next run.
            AS_OF=$(python3 -c "import json,sys; print(str(json.load(open('$W')).get('as_of',''))[:10])" 2>/dev/null || echo "")
            [ "$AS_OF" != "$(date -u +%F)" ] && FULL=yes
          fi
          [ "${INPUT_FULL}" = "yes" ] && FULL=yes
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "far sweep mode: full=${FULL}"

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4 "curl_cffi>=0.7"

      - name: Stagger shards
        # The initial full sweep 429-shredded kenna past ~day 9 with all four
        # shards hitting it in lockstep. 90s offsets desynchronise the date
        # loops without meaningfully slowing the sweep.
        run: sleep $(( ${{ matrix.shard }} * 90 ))

      - name: Scrape + push shard ${{ matrix.shard }}/4 (days 8-30)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
        run: |
          # Shuffle the far date order every run. kenna soft-throttles our
          # data-center IP partway through a sweep, starving whichever dates
          # fall in the back half of the loop; a fixed 8..30 order starved the
          # SAME middle dates every run (teeitup vanished from ~day 12-22).
          # Random order moves the starved band each run, and the
          # platform-liveness guard in aggregate.py means throttled-empty reads
          # never deactivate prior captures - so the union fills the horizon
          # over a few sweeps instead of any single run having to get all 23.
          for DATE in $(python -m scraper.dates --registry registry.json --start 8 --days 23 | shuf); do
            ARGS=""
            if [ "${{ needs.plan.outputs.full }}" != "yes" ]; then
              ELIG=$(python scripts/eligible_courses.py --date "${DATE}")
              if [ "$ELIG" = "NONE" ]; then
                echo "skip ${DATE}: no course's booking window reaches it"
                continue
              fi
              [ "$ELIG" != "ALL" ] && ARGS="--courses ${ELIG}"
            fi
            OUT="output/tee_times_${DATE}_s${{ matrix.shard }}.json"
            echo "::group::far ${DATE} shard ${{ matrix.shard }}"
            python -m scraper.aggregate --date "${DATE}" --workers 10 \
              --shard "${{ matrix.shard }}/4" \
              --exclude clubprophet,ezlinks,golfnow,clubcaddie,supersaas,golfwithaccess,teeitup,totale,trutee \
              ${ARGS} --out "${OUT}" || true
            python -m scraper.d1 push --data "${OUT}" || true
            echo "::endgroup::"
          done

      - name: Upload raw results (windows derivation + debugging)
        uses: actions/upload-artifact@v4
        with:
          name: far-tee-times-${{ github.run_id }}-s${{ matrix.shard }}
          path: output/tee_times_*.json
          retention-days: 7

  derive-windows:
    # Only after a FULL sweep, and only once (not per shard): pull all four
    # shards' outputs back down and measure each course's real booking window
    # from what the sweep itself saw.
    #
    # The mode comes from the plan job (never recomputed from the clock), and
    # needs.scrape.result must be success: windows may only SHRINK on a full
    # sweep's evidence, and a sweep with a dead shard is not full evidence —
    # deriving from three shards' outputs would shrink the fourth shard's
    # courses to nothing. Skipping leaves as_of stale, so the next run
    # automatically retries the full sweep.
    needs: [plan, scrape]
    if: needs.plan.outputs.full == 'yes' && needs.scrape.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download sweep outputs
        uses: actions/download-artifact@v4
        with:
          pattern: far-tee-times-${{ github.run_id }}-*
          path: output
          merge-multiple: true
      - name: Derive windows + commit
        run: |
          python scripts/derive_windows.py \
            --outputs 'output/tee_times_*.json' \
            --registry registry.json \
            --out probe-results/booking-windows.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe-results/booking-windows.json
          git diff --cached --quiet && { echo "windows unchanged"; exit 0; }
          git commit -m "Booking windows from full far sweep [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase && continue
          done
          exit 1

  chain:
    # The cron scheduler went 9+ hours without firing anything in this repo,
    # so the 2-hour cadence cannot depend on it (same lesson as scrape-near).
    # This job waits out the remainder of the 2-hour window from run start,
    # then dispatches the successor. if: always() so a failed sweep still
    # chains; the concurrency group holds at most one pending run either way.
    needs: [scrape, derive-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Wait out the cadence, then dispatch the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          START=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          ELAPSED=$(( $(date +%s) - $(date -d "$START" +%s) ))
          SLEEP=$(( 7200 - ELAPSED ))
          if [ "$SLEEP" -gt 0 ]; then
            echo "sweep took ${ELAPSED}s; sleeping ${SLEEP}s to hold the 2h cadence"
            sleep "$SLEEP"
          fi
          gh workflow run scrape-far.yml --ref main --repo "${{ github.repository }}" \
            && echo "successor dispatched" || echo "dispatch failed; cron backstop will restart"
