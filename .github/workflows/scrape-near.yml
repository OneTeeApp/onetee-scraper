name: Scrape near tier (days 0-3, 5-minute loop)

# The near tier wants a 5-minute cadence, and GitHub's cron scheduler cannot
# deliver that — this repo has already measured a `*/5` cron firing about
# every five HOURS (see prune-past.yml's history; that job moved to a
# Cloudflare cron for exactly this reason). The scrapers are Python + browser
# code that cannot live in a Worker, so the trick here is different: one
# long-lived Actions run that LOOPS internally every INTERVAL_SECONDS, for
# just under the 6-hour job ceiling.
#
# Continuity comes from SELF-CHAINING, not from the cron: on 2026-07-26 the
# scheduler went ~7 hours without firing a single cron in this repo — none of
# the existing hourly jobs either — so a cron-queued successor cannot be the
# primary mechanism. At the end of each run, shard 0 dispatches the next run
# via workflow_dispatch with the built-in GITHUB_TOKEN (workflow_dispatch and
# repository_dispatch are the documented exceptions to GITHUB_TOKEN's
# no-recursive-runs rule). The hourly cron stays as a crash backstop: if a
# run dies without reaching the chain step, the next cron firing — whenever
# the scheduler deigns to — restarts the loop, and the concurrency group
# keeps at most one successor pending either way.
#
# Request-volume note, on the record: this is ~12x the per-platform request
# rate of the old hourly scan. Every adapter already paces per-host (the
# shard count is exported so throttles divide), but if a platform starts
# 429ing, INTERVAL_SECONDS below is the one knob to turn — 600 halves the
# rate everywhere at once.

on:
  schedule:
    - cron: "3 * * * *"        # backstop/successor — see note above
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "registry.json"

permissions:
  contents: read
  actions: write             # shard 0 chains the next run (see header note)

concurrency:
  group: scrape-near
  cancel-in-progress: false     # queued successor waits; never kill the loop

env:
  INTERVAL_SECONDS: 300         # target cadence per pass (the one knob)
  LOOP_MINUTES: 330             # stop looping after this; job timeout is 350
  # Days 0-1 are refreshed on EVERY pass. Days 2-3 are refreshed only when this
  # much time has passed since they last were. Every pass previously scraped all
  # four dates, so day 3 was refreshed exactly as often as today — and days 2-3
  # are half the work of the single most expensive workflow in the repo (74,292
  # Actions minutes this month, 32% of the total).
  #
  # Deliberately TIME-based rather than "every Nth pass": the loop only sleeps
  # when a pass finishes inside INTERVAL_SECONDS, so pass duration is not fixed
  # and an every-Nth rule would give a staleness bound that drifts with load.
  # This way the bound is stated directly — days 2-3 are at most
  # FAR_STALE_SECONDS plus one pass old, whatever the pass costs.
  #
  # This does not trade freshness away, it moves it: a cheaper average pass means
  # MORE passes in the same loop budget, so days 0-1 — the ones someone is
  # actually booking — get refreshed more often than they do today.
  FAR_STALE_SECONDS: 600        # days 2-3 refresh interval (<= 10 min + a pass)

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4 "curl_cffi>=0.7"

      - name: Loop shard ${{ matrix.shard }}/4 over days 0-3
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          # VPS-ONLY cutover canary: D1 is not touched at all (no D1 writes billed).
          VPS_ONLY: "1"
          ONETEE_API_URL: https://api.oneteeapp.com
          ONETEE_INGEST_TOKEN: ${{ secrets.VPS_INGEST_TOKEN }}
        run: |
          START=$(date +%s)
          PASS=0
          LAST_FAR=0                 # forces days 2-3 on the first pass
          while true; do
            NOW=$(date +%s)
            ELAPSED_MIN=$(( (NOW - START) / 60 ))
            if [ "$ELAPSED_MIN" -ge "$LOOP_MINUTES" ]; then
              echo "loop budget spent after $PASS passes"; break
            fi
            PASS=$((PASS + 1))
            T0=$(date +%s)
            # Days 0-1 every pass; days 2-3 only when they are FAR_STALE_SECONDS
            # old. LAST_FAR starts at 0 so the first pass of every run covers the
            # full window — a fresh runner never inherits a stale day 2.
            FAR_AGE=$(( T0 - LAST_FAR ))
            if [ "$FAR_AGE" -ge "$FAR_STALE_SECONDS" ]; then
              DAYS=4; LAST_FAR=$T0; SCOPE="days 0-3"
            else
              DAYS=2; SCOPE="days 0-1"
            fi
            echo "pass ${PASS}: ${SCOPE} (days 2-3 were ${FAR_AGE}s old)"
            for DATE in $(python -m scraper.dates --registry registry.json --days "$DAYS"); do
              OUT="output/tee_times_${DATE}_s${{ matrix.shard }}.json"
              echo "::group::pass ${PASS} ${DATE} shard ${{ matrix.shard }}"
              python -m scraper.aggregate --date "${DATE}" --workers 10 \
                --shard "${{ matrix.shard }}/4" \
                --exclude clubprophet,ezlinks,golfnow,clubcaddie,supersaas,golfwithaccess,teeitup,totale,trutee,teesnap \
                --out "${OUT}" || true
              python -m scraper.d1 push --data "${OUT}" || true
              echo "::endgroup::"
            done
            T1=$(date +%s)
            TOOK=$((T1 - T0))
            SLEEP=$((INTERVAL_SECONDS - TOOK))
            if [ "$SLEEP" -gt 0 ]; then
              echo "pass ${PASS} took ${TOOK}s; sleeping ${SLEEP}s"
              sleep "$SLEEP"
            else
              echo "pass ${PASS} took ${TOOK}s (over interval; no sleep)"
            fi
          done

      - name: Chain the next loop run (shard 0 only)
        if: always() && matrix.shard == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scrape-near.yml --ref main --repo "${{ github.repository }}" \
            && echo "successor dispatched" || echo "dispatch failed; cron backstop will restart"
