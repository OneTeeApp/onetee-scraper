name: Scrape near tier (days 0-2, 5-minute loop)

# The near tier wants a 5-minute cadence, and GitHub's cron scheduler cannot
# deliver that — this repo has already measured a `*/5` cron firing about
# every five HOURS (see prune-past.yml's history; that job moved to a
# Cloudflare cron for exactly this reason). The scrapers are Python + browser
# code that cannot live in a Worker, so the trick here is different: one
# long-lived Actions run that LOOPS internally every INTERVAL_SECONDS, for
# just under the 6-hour job ceiling.
#
# Continuity comes from SELF-CHAINING, not from the cron: on 2026-07-26 the
# scheduler went ~7 hours without firing a single cron in this repo — none of
# the existing hourly jobs either — so a cron-queued successor cannot be the
# primary mechanism. At the end of each run, shard 0 dispatches the next run
# via workflow_dispatch with the built-in GITHUB_TOKEN (workflow_dispatch and
# repository_dispatch are the documented exceptions to GITHUB_TOKEN's
# no-recursive-runs rule). The hourly cron stays as a crash backstop: if a
# run dies without reaching the chain step, the next cron firing — whenever
# the scheduler deigns to — restarts the loop, and the concurrency group
# keeps at most one successor pending either way.
#
# Request-volume note, on the record: this is ~12x the per-platform request
# rate of the old hourly scan. Every adapter already paces per-host (the
# shard count is exported so throttles divide), but if a platform starts
# 429ing, INTERVAL_SECONDS below is the one knob to turn — 600 halves the
# rate everywhere at once.

on:
  schedule:
    - cron: "3 * * * *"        # backstop/successor — see note above
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write             # shard 0 chains the next run (see header note)

concurrency:
  group: scrape-near
  cancel-in-progress: false     # queued successor waits; never kill the loop

env:
  INTERVAL_SECONDS: 300         # target cadence per pass (the one knob)
  LOOP_MINUTES: 330             # stop looping after this; job timeout is 350

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Loop shard ${{ matrix.shard }}/4 over days 0-2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
        run: |
          START=$(date +%s)
          PASS=0
          while true; do
            NOW=$(date +%s)
            ELAPSED_MIN=$(( (NOW - START) / 60 ))
            if [ "$ELAPSED_MIN" -ge "$LOOP_MINUTES" ]; then
              echo "loop budget spent after $PASS passes"; break
            fi
            PASS=$((PASS + 1))
            T0=$(date +%s)
            for DATE in $(python -m scraper.dates --registry registry.json --days 3); do
              OUT="output/tee_times_${DATE}_s${{ matrix.shard }}.json"
              echo "::group::pass ${PASS} ${DATE} shard ${{ matrix.shard }}"
              python -m scraper.aggregate --date "${DATE}" --workers 10 \
                --shard "${{ matrix.shard }}/4" \
                --exclude clubprophet,ezlinks,golfnow,clubcaddie,supersaas \
                --out "${OUT}" || true
              python -m scraper.d1 push --data "${OUT}" || true
              echo "::endgroup::"
            done
            T1=$(date +%s)
            TOOK=$((T1 - T0))
            SLEEP=$((INTERVAL_SECONDS - TOOK))
            if [ "$SLEEP" -gt 0 ]; then
              echo "pass ${PASS} took ${TOOK}s; sleeping ${SLEEP}s"
              sleep "$SLEEP"
            else
              echo "pass ${PASS} took ${TOOK}s (over interval; no sleep)"
            fi
          done

      - name: Chain the next loop run (shard 0 only)
        if: always() && matrix.shard == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scrape-near.yml --ref main --repo "${{ github.repository }}" \
            && echo "successor dispatched" || echo "dispatch failed; cron backstop will restart"
