name: Deploy Worker API

# (re-trigger: retry after prune landed — Worker still owes sub-course
#  names, venue dedupe and the belt-and-braces past-time filter)
# Deploys the Cloudflare Worker (worker/) with `wrangler deploy`, using the same
# secrets as the scraper. The repo's wrangler.toml keeps a placeholder D1 id; the
# real id is injected here from CLOUDFLARE_D1_DB_ID so it never lives in git.
# After deploying, it self-verifies the venue fix (a re-tagged CO course must
# come back ONCE with its native platform) and commits the result for polling.
#
# NOTE: this needs CLOUDFLARE_API_TOKEN to have the "Workers Scripts:Edit"
# permission. The scraper's token may be D1-only — if deploy fails on auth, the
# committed probe-results/deploy.txt will say so, and the token needs that scope
# added (or a separate secret).

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: write

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inject real D1 id + deploy
        id: deploy
        continue-on-error: true
        env:
          # Prefer a dedicated deploy token (Workers Scripts:Edit) if present, so
          # the scraper's D1-only CLOUDFLARE_API_TOKEN can stay untouched.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
        run: |
          # pipefail or the gate below is decorative: this step's status is the
          # LAST command in the pipeline, so `wrangler deploy | tee` reports
          # tee's 0 even when the deploy fails, `steps.deploy.outcome` is always
          # 'success', and "Fail if deploy errored" can never fire. A broken
          # deploy would have been reported as a green run. The `|| true` on
          # whoami still does its job — that one genuinely may fail.
          set -o pipefail
          cd worker
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${CLOUDFLARE_D1_DB_ID}/" wrangler.toml
          echo "=== wrangler whoami (token scopes) ===" | tee ../deploy.log
          # whoami prints the account email and id. The repo is public, and so
          # is this job's log — send the output ONLY to deploy.log, which the
          # verify step below redacts before it is committed. Never tee it.
          npx --yes wrangler@3 whoami >> ../deploy.log 2>&1 || true
          echo "=== wrangler deploy ===" | tee -a ../deploy.log
          # deploy; capture all output (incl. the published workers.dev URL)
          npx --yes wrangler@3 deploy 2>&1 | tee -a ../deploy.log

      # The sed above writes the real D1 database id into a TRACKED file, so
      # until it is put back the checkout is dirty with a secret in it. Two
      # things went wrong because it was not:
      #   * every `git pull --rebase` below refused outright ("cannot pull with
      #     rebase: You have unstaged changes"), so all five retries failed
      #     identically and this job has been red on every run since 2026-07-25
      #     while wrangler itself succeeded every time;
      #   * a tracked file holding the id sat in the working tree of a PUBLIC
      #     repo, one careless `git add -A` away from being published.
      # always() so it still runs when the deploy step fails.
      - name: Restore wrangler.toml (drops the injected D1 id)
        if: always()
        run: git checkout -- worker/wrangler.toml

      - name: Verify live venue fix + record result
        if: always()
        # This file gets COMMITTED, and the repo is public. `wrangler whoami`
        # prints the account id and the account's email address, so the log is
        # redacted on its way to disk rather than trusted to be boring. The
        # patterns are shape-based (32-hex, uuid, email) so a future wrangler
        # version printing something new is covered without anyone noticing it
        # needs to be.
        run: |
          mkdir -p probe-results
          {
            echo "=== deploy log (full: whoami + deploy) ==="
            cat deploy.log 2>/dev/null || echo "(no deploy log — step failed early)"
            URL=$(grep -oE "https://[a-z0-9.-]+\.workers\.dev" deploy.log 2>/dev/null | head -1)
            echo
            echo "deployed URL: ${URL:-UNKNOWN}"
            if [ -n "$URL" ]; then
              echo
              echo "=== GET ${URL}/api/health ==="
              curl -s --max-time 20 "${URL}/api/health" || echo "(health fetch failed)"
              echo
              echo "=== GET ${URL}/api/courses?state=CO  (arrowhead / bella ridge should each appear ONCE, native platform) ==="
              curl -s --max-time 20 "${URL}/api/courses?state=CO" \
                | python3 -c "import sys,json; cs=json.load(sys.stdin)['courses']; [print(' ',c['course_slug'],'|',c.get('platform'),'|',c.get('slots'),'slots |',c.get('state')) for c in cs if 'arrowhead' in c['course_slug'] or 'bella-ridge' in c['course_slug'] or 'cedaredge' in c['course_slug']]" \
                || echo "(courses fetch/parse failed)"
              echo
              echo "duplicate-check: count of course_slugs containing '-golfnow' (should be 0):"
              curl -s --max-time 20 "${URL}/api/courses?state=CO" \
                | python3 -c "import sys,json; cs=json.load(sys.stdin)['courses']; print(' ', sum('-golfnow' in c['course_slug'] for c in cs))" \
                || echo "(dup check failed)"
            fi
          } 2>&1 | sed -E \
            -e 's/[0-9a-f]{32}/<redacted-account-id>/g' \
            -e 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<redacted-id>/g' \
            -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<redacted-email>/g' \
            | tee probe-results/deploy.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results/deploy.txt
          git commit -m "worker deploy result [skip ci]" || exit 0
          # Retry the push: the probe workflows write to probe-results/ too, so
          # a single push can genuinely lose a race when they overlap.
          # NOTE: a red job here has historically NOT meant that race. From
          # 2026-07-25 to 2026-07-28 every failure was the dirty wrangler.toml
          # above blocking the rebase, and the retry loop could never clear it.
          # Read the log before believing the race explanation again.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "could not push the deploy log after 5 attempts"; exit 1

      - name: Fail if deploy errored
        if: steps.deploy.outcome != 'success'
        run: |
          echo "wrangler deploy did not succeed — see probe-results/deploy.txt"
          exit 1

# re-trigger: re-deploy and capture the log, to confirm the */5 cron trigger
# registered (evidence says it did — D1's oldest elapsed-active row is ~1 minute
# old with nothing else pruning — but the log that would prove it was lost).
