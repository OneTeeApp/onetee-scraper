name: Scrape GolfNow via browser (0-6 hourly, 7-30 in halves every 6h)

# GolfNow shows no interactive challenge to a real browser, but the plain HTTP
# client is blocked. A headless Chromium loads each facility's search page,
# captures the predicate the page itself POSTs to /api/tee-times/
# tee-time-search-results, and replays it per date — inheriting the page's own
# lat/long so results are the real facility's times (filtered by facilityId).
# The plain scraper excludes golfnow, so this job solely owns those slugs in D1.
# Hourly for the same reason as the other browser jobs.

on:
  schedule:
    # SHALLOW, days 0-6. Every hour except the four tail slots below, so the
    # twenty-four-runs-a-day cadence is unchanged.
    - cron: "52 0,1,2,3,5,6,7,8,9,11,12,13,14,15,17,18,19,20,21,23 * * *"
    # TAIL A, days 7-18, and TAIL B, days 19-30. Matched by their exact cron
    # strings in the step below. See the long comment there for why the horizon
    # is split in half and why this is not a clock test.
    - cron: "52 4 * * *"
    - cron: "52 16 * * *"
    - cron: "52 10 * * *"
    - cron: "52 22 * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "near (0-6) | tail-a (7-18) | tail-b (19-30) | full (0-30)"
        default: ""
      deep:
        description: "yes = full 0-30 (kept for callers that predate `window`)"
        default: "no"
  push:
    branches: [main]
    paths:
      - "registry.json"
      - "scraper/browser_golfnow.py"
      - ".github/workflows/scrape-golfnow-browser.yml"

permissions:
  contents: read

concurrency:
  group: scrape-golfnow-browser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    # SHARDED, and the shard count lives in a repo VARIABLE so it can be dialled
    # without a commit — the same instant-revert lever as BROWSER_LANES.
    #
    # golfnow was the slowest thing in the fleet by a distance: 60 minutes for
    # the seven-date shallow pass, measured over 20 runs, because it is ~69
    # browser page-loads per date with nothing shared between them. Six shards
    # take that to roughly ten minutes of work.
    #
    # Set GOLFNOW_SHARDS to a JSON array to change it, e.g. "[0,1,2,3]" to fall
    # back to four if six turns out to draw more challenges from golfnow.com.
    # The count is read back from strategy.job-total, so the --shard argument
    # can never disagree with the matrix.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(vars.GOLFNOW_SHARDS || '[0,1,2,3,4,5]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Scrape + push each date to D1 (tiered horizon)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          VPS_ONLY: "1"
          ONETEE_API_URL: https://api.oneteeapp.com
          ONETEE_INGEST_TOKEN: ${{ secrets.VPS_INGEST_TOKEN }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          # TWO BUGS WERE FIXED HERE ON 2026-08-15, AND THEY COMPOUNDED.
          #
          # (1) The horizon gate read:
          #         [ "$(date -u +%H)" = "10" ] && DEEP=yes
          #     an exact wall-clock hour equality evaluated INSIDE the job, so
          #     it only held if the runner reached this line during the 10:00
          #     UTC hour. GitHub delivers scheduled events late under load and
          #     sometimes drops a slot outright — this workflow's cron missed
          #     hour 10 entirely on 08-11 — and a miss silently costs the whole
          #     day's horizon. github.event.schedule is the cron expression that
          #     FIRED, so delivery jitter cannot move a run out of its slot.
          #     (The same bug took ~8,000 golfwithaccess tee times off the site
          #     on 08-14; see that workflow for the full write-up.)
          #
          # (2) Even when it DID fire, it never finished. Every hour-10 run from
          #     08-09 to 08-15 ran 170-180 minutes against timeout-minutes: 170
          #     — i.e. it was killed mid-sweep, every single day. The dates were
          #     NOT shuffled, so it died at the same place each time and the
          #     tail was permanently starved: the API served golfnow to about
          #     day 18 and nothing beyond.
          #
          # So the horizon is now SPLIT IN HALF and each half runs twice a day,
          # 12 hours apart. Twelve dates comfortably fits the budget, both
          # halves stay inside the read API's 30h far-freshness cut even if one
          # delivery is dropped, and the four tail runs together cost about what
          # the one timing-out run cost. Shuffled as well, so if a run IS short
          # of budget it leaves a different gap each time.
          MODE=near
          case "${{ github.event.schedule }}" in
            "52 4 * * *"|"52 16 * * *")  MODE=tail-a ;;
            "52 10 * * *"|"52 22 * * *") MODE=tail-b ;;
          esac
          # A dispatch can name any window. Before this input existed the only
          # manual lever was deep=yes (the whole 0-30), which at the measured
          # rate was ~267 minutes against a 170-minute timeout — so a tail that
          # had gone dark could not actually be repaired by hand, only waited
          # for. That is also what stopped the supervisor from healing a golfnow
          # horizon collapse: it could dispatch the workflow, but only into the
          # shallow window.
          [ -n "${{ github.event.inputs.window }}" ] && MODE="${{ github.event.inputs.window }}"
          [ "${{ github.event.inputs.deep }}" = "yes" ] && MODE=full
          case "$MODE" in
            full)   START=0;  WINDOW=31 ;;
            tail-a) START=7;  WINDOW=12 ;;
            tail-b) START=19; WINDOW=12 ;;
            *)      START=0;  WINDOW=7  ;;
          esac
          echo "golfnow horizon: mode=${MODE}, days ${START}-$((START + WINDOW - 1)), shard ${SHARD}"
          # Offset the shards from each other so they do not hit golfnow in
          # lockstep. Bounded, not proportional to the shard index: a matrix run
          # costs as much as its slowest shard, so a per-index offset would tax
          # exactly the shard that finishes last.
          sleep $(( RANDOM % 90 ))
          # Dates from scraper.dates (union of local todays across covered
          # timezones), not `date -u`: after ~5pm Mountain the UTC date is
          # already tomorrow and a UTC "today" skips the real one.
          for DATE in $(python -m scraper.dates --registry registry.json \
                          --days "$WINDOW" --start "$START" | shuf); do
            # Per-shard output filename. Without it every shard would write and
            # push the same output/gn_<date>.json and clobber the others.
            # d1.sync only deactivates courses present in the scrape it is
            # given, so a per-shard push touches only that shard's courses.
            OUT="output/gn_${DATE}_s${SHARD}.json"
            echo "::group::golfnow browser ${DATE} shard ${SHARD}"
            python -m scraper.browser_golfnow --date "${DATE}" \
              --shard "${SHARD}/${SHARDS}" --out "${OUT}" || true
            python -m scraper.d1 push --data "${OUT}" || true
            echo "::endgroup::"
          done
