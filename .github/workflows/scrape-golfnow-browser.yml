name: Scrape GolfNow via browser (0-6 hourly, 7-30 in halves every 6h)

# GolfNow shows no interactive challenge to a real browser, but the plain HTTP
# client is blocked. A headless Chromium loads each facility's search page,
# captures the predicate the page itself POSTs to /api/tee-times/
# tee-time-search-results, and replays it per date — inheriting the page's own
# lat/long so results are the real facility's times (filtered by facilityId).
# The plain scraper excludes golfnow, so this job solely owns those slugs in D1.
# Hourly for the same reason as the other browser jobs.

on:
  schedule:
    # SHALLOW, days 0-6. Every hour except the four tail slots below, so the
    # twenty-four-runs-a-day cadence is unchanged.
    - cron: "52 0,1,2,3,5,6,7,8,9,11,12,13,14,15,17,18,19,20,21,23 * * *"
    # TAIL A, days 7-18, and TAIL B, days 19-30. Matched by their exact cron
    # strings in the step below. See the long comment there for why the horizon
    # is split in half and why this is not a clock test.
    - cron: "52 4 * * *"
    - cron: "52 16 * * *"
    - cron: "52 10 * * *"
    - cron: "52 22 * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "near (4-6) | tail-a (7-18) | tail-b (19-30) | full (0-30)"
        default: ""
      deep:
        description: "yes = full 0-30 (kept for callers that predate `window`)"
        default: "no"
  push:
    branches: [main]
    paths:
      - "registry.json"
      - "scraper/browser_golfnow.py"
      - ".github/workflows/scrape-golfnow-browser.yml"

permissions:
  # write, because the full sweep now derives each course's booking window from
  # its own output and commits it. Read was enough while nothing here wrote.
  contents: write

concurrency:
  group: scrape-golfnow-browser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    # SHARDED, and the shard count lives in a repo VARIABLE so it can be dialled
    # without a commit — the same instant-revert lever as BROWSER_LANES.
    #
    # golfnow was the slowest thing in the fleet by a distance: 60 minutes for
    # the seven-date shallow pass, measured over 20 runs, because it is ~69
    # browser page-loads per date with nothing shared between them. Six shards
    # take that to roughly ten minutes of work.
    #
    # Set GOLFNOW_SHARDS to a JSON array to change it, e.g. "[0,1,2,3]" to fall
    # back to four if six turns out to draw more challenges from golfnow.com.
    # The count is read back from strategy.job-total, so the --shard argument
    # can never disagree with the matrix.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(vars.GOLFNOW_SHARDS || '[0,1,2,3,4,5]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Scrape + push each date to D1 (tiered horizon)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          VPS_ONLY: "1"
          ONETEE_API_URL: https://api.oneteeapp.com
          ONETEE_INGEST_TOKEN: ${{ secrets.VPS_INGEST_TOKEN }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          # TWO BUGS WERE FIXED HERE ON 2026-08-15, AND THEY COMPOUNDED.
          #
          # (1) The horizon gate read:
          #         [ "$(date -u +%H)" = "10" ] && DEEP=yes
          #     an exact wall-clock hour equality evaluated INSIDE the job, so
          #     it only held if the runner reached this line during the 10:00
          #     UTC hour. GitHub delivers scheduled events late under load and
          #     sometimes drops a slot outright — this workflow's cron missed
          #     hour 10 entirely on 08-11 — and a miss silently costs the whole
          #     day's horizon. github.event.schedule is the cron expression that
          #     FIRED, so delivery jitter cannot move a run out of its slot.
          #     (The same bug took ~8,000 golfwithaccess tee times off the site
          #     on 08-14; see that workflow for the full write-up.)
          #
          # (2) Even when it DID fire, it never finished. Every hour-10 run from
          #     08-09 to 08-15 ran 170-180 minutes against timeout-minutes: 170
          #     — i.e. it was killed mid-sweep, every single day. The dates were
          #     NOT shuffled, so it died at the same place each time and the
          #     tail was permanently starved: the API served golfnow to about
          #     day 18 and nothing beyond.
          #
          # So the horizon is now SPLIT IN HALF and each half runs twice a day,
          # 12 hours apart. Twelve dates comfortably fits the budget, both
          # halves stay inside the read API's 30h far-freshness cut even if one
          # delivery is dropped, and the four tail runs together cost about what
          # the one timing-out run cost. Shuffled as well, so if a run IS short
          # of budget it leaves a different gap each time.
          MODE=near
          case "${{ github.event.schedule }}" in
            "52 4 * * *"|"52 16 * * *")  MODE=tail-a ;;
            "52 10 * * *"|"52 22 * * *") MODE=tail-b ;;
          esac
          # A dispatch can name any window. Before this input existed the only
          # manual lever was deep=yes (the whole 0-30), which at the measured
          # rate was ~267 minutes against a 170-minute timeout — so a tail that
          # had gone dark could not actually be repaired by hand, only waited
          # for. That is also what stopped the supervisor from healing a golfnow
          # horizon collapse: it could dispatch the workflow, but only into the
          # shallow window.
          [ -n "${{ github.event.inputs.window }}" ] && MODE="${{ github.event.inputs.window }}"
          [ "${{ github.event.inputs.deep }}" = "yes" ] && MODE=full
          # NEAR STARTS AT DAY 4, NOT DAY 0. golfnow is ALSO in
          # scrape-browser-near.yml's rotation, which covers days 0-3 — day 0 on
          # every pass and days 1-3 every FULL_EVERY passes. This workflow used
          # to re-scrape 0-6, so days 0-3 were fetched twice by two different
          # workflows, and the duplicate landed on the single most saturated lane
          # in the fleet (every browser-near pass logs "over interval; no sleep").
          # Starting at 4 removes the overlap and cuts this pass from 7 dates to
          # 3. Days 4-6 have no other owner, so the window cannot start later.
          case "$MODE" in
            full)   START=0;  WINDOW=31 ;;
            tail-a) START=7;  WINDOW=12 ;;
            tail-b) START=19; WINDOW=12 ;;
            *)      START=4;  WINDOW=3  ;;
          esac
          # `schedule` is the cron expression GitHub says fired. Without it in the
          # log there is no way, after the fact, to tell a DROPPED tail slot from a
          # tail slot that fired and failed to match the case above — on 08-16 both
          # tail slots produced mode=near runs and the two explanations could not be
          # separated. Empty on a manual dispatch, which is itself the tell.
          echo "golfnow horizon: mode=${MODE}, days ${START}-$((START + WINDOW - 1)), shard ${SHARD}, schedule='${{ github.event.schedule }}'"
          # Offset the shards from each other so they do not hit golfnow in
          # lockstep. Bounded, not proportional to the shard index: a matrix run
          # costs as much as its slowest shard, so a per-index offset would tax
          # exactly the shard that finishes last.
          sleep $(( RANDOM % 90 ))
          # Dates from scraper.dates (union of local todays across covered
          # timezones), not `date -u`: after ~5pm Mountain the UTC date is
          # already tomorrow and a UTC "today" skips the real one.
          for DATE in $(python -m scraper.dates --registry registry.json \
                          --days "$WINDOW" --start "$START" | shuf); do
            # Per-shard output filename. Without it every shard would write and
            # push the same output/gn_<date>.json and clobber the others.
            # d1.sync only deactivates courses present in the scrape it is
            # given, so a per-shard push touches only that shard's courses.
            # PER-COURSE PRUNING, on the tails only.
            #
            # eligible_courses.py answers, per DATE, which individual courses
            # have a booking window that actually reaches it — the windows file
            # is keyed by slug, not by platform. ONLY_COURSES is how the browser
            # scrapers consume that (see scraper/sharding.py); aggregate.py has
            # had --courses for this all along.
            #
            # Deliberately NOT applied to mode=near. derive_windows.py floors
            # every window at 7 days precisely because the near and mid tiers
            # cover days 0-7 unconditionally, so on a 0-6 pass every course is
            # eligible by construction and the call would be pure overhead.
            #
            # `|| echo ALL` and the ALL default keep this failing open: a
            # missing or unreadable windows file must cost requests, never
            # coverage.
            ELIG=ALL
            case "$MODE" in
              tail-a|tail-b)
                # `ELIG=$(cmd) || ELIG=ALL`, NOT `$(cmd || echo ALL)`. The
                # second form concatenates whatever the command printed before
                # it died WITH the word ALL, so a crash after partial output
                # yields a truncated slug list that looks authoritative and
                # silently prunes real courses. This form throws the partial
                # output away.
                ELIG=$(python scripts/eligible_courses.py --date "${DATE}" \
                         --platform golfnow) || ELIG=ALL
                if [ -z "$ELIG" ]; then ELIG=ALL; fi
                if [ "$ELIG" = "NONE" ]; then
                  echo "skip ${DATE}: no golfnow course's window reaches it"
                  continue
                fi
                ;;
            esac
            export ONLY_COURSES="$ELIG"
            OUT="output/gn_${DATE}_s${SHARD}.json"
            echo "::group::golfnow browser ${DATE} shard ${SHARD}"
            python -m scraper.browser_golfnow --date "${DATE}" \
              --shard "${SHARD}/${SHARDS}" --out "${OUT}" || true
            python -m scraper.d1 push --data "${OUT}" || true
            echo "::endgroup::"
          done

      - name: Upload sweep outputs (windows derivation + debugging)
        if: github.event.inputs.window == 'full' || github.event.inputs.deep == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: gn-tee-times-${{ github.run_id }}-s${{ matrix.shard }}
          path: output/gn_*.json
          retention-days: 7

  derive-windows:
    # Only after a FULL 0-30 sweep, and only once rather than per shard: pull
    # every shard's output back down and measure each course's real booking
    # window from what the sweep itself saw. Zero extra requests — it reads the
    # run's own output.
    #
    # The gate is the dispatch input, not a recomputed clock and not the mode
    # variable inside the matrix job: `full` is reachable only by dispatch, so
    # the same condition that produced the sweep decides whether to derive from
    # it. needs.scrape.result == 'success' because windows may only SHRINK on a
    # full sweep's evidence, and a sweep with a dead shard is not full evidence —
    # deriving from five shards would shrink the sixth shard's courses to their
    # floor.
    needs: scrape
    if: >-
      needs.scrape.result == 'success' &&
      (github.event.inputs.window == 'full' || github.event.inputs.deep == 'yes')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download sweep outputs
        uses: actions/download-artifact@v4
        with:
          pattern: gn-tee-times-${{ github.run_id }}-*
          path: output
          merge-multiple: true
      - name: Derive windows + commit
        run: |
          # --merge and a --source label of our own: this file has several
          # contributors and a wholesale overwrite once deleted all 382 teeitup
          # windows (c9434c8). NO --stamp-as-of: the top-level as_of belongs to
          # scrape-far.yml's plain sweep, which reads it to decide whether it has
          # run a full sweep today.
          python scripts/derive_windows.py \
            --outputs 'output/gn_*.json' \
            --registry registry.json \
            --out probe-results/booking-windows.json \
            --merge --source golfnow-deep
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe-results/booking-windows.json
          git diff --cached --quiet && { echo "windows unchanged"; exit 0; }
          git commit -m "Booking windows from full golfnow sweep [skip ci]"
          # RE-DERIVE ONTO LATEST rather than rebase — merge-mode derivation is
          # idempotent and touches only this contributor's slugs, so on a
          # rejected push we throw our commit away, take the other side whole,
          # and re-apply. git is never asked to reconcile the JSON, so it cannot
          # wedge the runner mid-rebase the way `git pull --rebase` did on
          # 2026-08-15.
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "push rejected (attempt $i) — re-deriving onto the latest main"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python scripts/derive_windows.py \
              --outputs 'output/gn_*.json' \
              --registry registry.json \
              --out probe-results/booking-windows.json \
              --merge --source golfnow-deep
            git add probe-results/booking-windows.json
            git diff --cached --quiet && { echo "nothing to add after re-derive"; exit 0; }
            git commit -m "Booking windows from full golfnow sweep [skip ci]"
          done
          exit 1
