name: Supervisor — revive dead loops, dispatch overdue cron jobs

# WHY THIS IS ITSELF A LOOP NOW (2026-08-16).
#
# This file used to be a plain cron workflow that revived dead self-chaining
# loops. That is a guard against cron failure which is itself delivered by cron,
# and on 2026-08-16 that circularity stopped being theoretical.
#
# Measured, from this repo's own run history:
#
#   * It asks for "*/15 * * * *" — four ticks an hour. Its ACTUAL gaps on
#     2026-08-15 were 20, 46, 55, 19, 52, 59, 50, 72, 50, 57, 19, 51 and 66
#     minutes. Median 51. GitHub delivers this repo roughly ONE scheduled event
#     per hour per workflow no matter how many slots are declared.
#
#   * Delivery stops outright for hours. At 02:53 UTC on 2026-08-16 EVERY
#     workflow here had its last scheduled run between 23:39 and 00:00 — nearly
#     three hours with not one scheduled event, this watchdog included. The only
#     things still running were the self-chaining loops, because a loop
#     dispatches its successor from inside a job that is already running and
#     never asks the scheduler for anything.
#
# That unreliability is the single root cause behind three user-visible faults in
# 36 hours: golfwithaccess losing days 14-30 (~8,000 tee times) when its daily
# horizon sweep's cron was dropped two days running; Walnut Creek advertising a
# 12:30 the club had already sold, from an hourly cron whose real gaps reached
# two hours; and a shipped open_spots fix sitting undelivered for an hour.
#
# So this job now runs the same way the loops do — it ticks every 15 minutes for
# ~5.25 hours inside ONE job and dispatches its own successor — and it takes on a
# second duty: dispatching the cron-driven scrapers when they are overdue. Cron
# stays as a crash backstop for the supervisor itself. It is the only workflow
# whose death is not covered by anything else, which is exactly why it must not
# depend on the scheduler to stay alive.
#
# WHY DISPATCHING CANNOT RUN AWAY.
#   * A dispatch creates a run, which resets that workflow's age, so the same
#     workflow cannot be dispatched twice in a row by this rule.
#   * Every target has its own concurrency group, so a redundant dispatch queues
#     as a successor instead of running a second copy.
#   * MAX_DISPATCH_PER_TICK caps a mass revival after a long stall, so we refill
#     the runner pool gradually instead of asking for sixteen runners at once.
#     The next tick picks up whatever was left.
#   * Thresholds are ~2.5x the nominal interval, so ordinary jitter never
#     triggers a dispatch — only a genuine miss does.

on:
  schedule:
    - cron: "*/15 * * * *"   # crash backstop ONLY; the self-chain is primary
  workflow_dispatch: {}

permissions:
  actions: write             # list runs + dispatch the workflows it supervises

concurrency:
  group: watchdog-near-loops
  cancel-in-progress: false  # queued successor waits; never kill the supervisor

env:
  TICK_SECONDS: 900          # one sweep per 15 min
  LOOP_MINUTES: 315          # stop looping after this; job timeout is 335
  MAX_DISPATCH_PER_TICK: 4   # gradual refill after a stall

jobs:
  supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 335
    steps:
      - name: Supervise every tier
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # SELF-CHAINING LOOPS. Healthy == at least one run whose status is not
          # "completed". A live loop always has one: it runs for hours and, under
          # cancel-in-progress:false, queues its successor before the current job
          # ends, so there is never a gap with zero active runs. Zero means dead.
          LOOPS="scrape-near.yml
          scrape-teeitup-browser-near.yml
          scrape-browser-near.yml
          scrape-cps-browser-near.yml
          scrape-cps-plain-near.yml
          scrape-teesnap.yml"

          # CRON-DRIVEN SHORT JOBS: workflow|max_age_minutes|extra gh args.
          # These are idle between runs by design, so "no active run" says
          # nothing; AGE since the last run of any kind is the signal.
          #
          # scrape-cps-browser is dispatched with explicit inputs because its
          # defaults (set=all, deep=no) would run a near sweep the plain loop
          # already owns and skip the daily 0-30 deep that is the whole point.
          # Its threshold is 30h to match FRESH_FAR_MIN in vps/api/server.mjs:
          # past that the far rows stop being served, which is the failure this
          # is here to prevent.
          OVERDUE="scrape.yml|150|
          prune-past.yml|150|
          monitor-inventory.yml|150|
          scrape-ezlinks-browser.yml|150|
          scrape-golfnow-browser.yml|150|
          scrape-clubcaddie-browser.yml|150|
          scrape-supersaas-browser.yml|150|
          scrape-totale-browser.yml|150|
          scrape-trutee-browser.yml|150|
          scrape-golfwithaccess-browser.yml|300|
          scrape-teeitup-browser.yml|300|
          scrape-teesnap-far.yml|300|
          scrape-far.yml|300|
          alert-landed-zero.yml|900|
          scrape-cps-browser.yml|1800|-f set=all -f deep=yes"

          START=$(date +%s)
          TICK=0
          while true; do
            NOW=$(date +%s)
            if [ $(( (NOW - START) / 60 )) -ge "$LOOP_MINUTES" ]; then
              echo "supervisor budget spent after ${TICK} ticks"; break
            fi
            TICK=$((TICK + 1))
            SENT=0
            echo "::group::tick ${TICK} ($(date -u +%H:%M:%SZ))"

            for WF in $LOOPS; do
              ACTIVE=$(gh run list --repo "$REPO" --workflow "$WF" --limit 15 \
                         --json status --jq '[.[] | select(.status != "completed")] | length' \
                       < /dev/null 2>/dev/null || echo "err")
              if [ "$ACTIVE" = "err" ]; then
                echo "::warning::could not query runs for $WF — skipping this tick"
                continue
              fi
              if [ "$ACTIVE" -eq 0 ]; then
                if [ "$SENT" -ge "$MAX_DISPATCH_PER_TICK" ]; then
                  echo "$WF is dead but the dispatch cap is spent — next tick"
                  continue
                fi
                echo "::warning::$WF has NO active run — reviving"
                gh workflow run "$WF" --repo "$REPO" --ref main < /dev/null \
                  && { SENT=$((SENT + 1)); echo "revived $WF"; } \
                  || echo "::error::dispatch failed for $WF (next tick will retry)"
              else
                echo "$WF alive ($ACTIVE active run(s))"
              fi
            done

            while IFS='|' read -r WF MAXAGE EXTRA; do
              [ -z "$WF" ] && continue
              # A FAILED QUERY IS NOT AN OVERDUE WORKFLOW. gh exits non-zero on
              # an API error and zero-with-empty-output when the workflow simply
              # has no runs yet. Collapsing those two would turn a GitHub API
              # outage into a dispatch of every workflow in the table at once —
              # hammering the API precisely when it is already failing.
              LAST=$(gh run list --repo "$REPO" --workflow "$WF" --limit 1 \
                       --json createdAt --jq '.[0].createdAt' \
                     < /dev/null 2>/dev/null) || LAST="__ERR__"
              if [ "$LAST" = "__ERR__" ]; then
                echo "::warning::could not query runs for $WF — skipping this tick"
                continue
              fi
              if [ -z "$LAST" ] || [ "$LAST" = "null" ]; then
                AGE=999999                 # never run: genuinely due
              else
                AGE=$(( ( $(date +%s) - $(date -d "$LAST" +%s) ) / 60 ))
              fi
              if [ "$AGE" -lt "$MAXAGE" ]; then
                echo "$WF ok (${AGE}m old, limit ${MAXAGE}m)"
                continue
              fi
              if [ "$SENT" -ge "$MAX_DISPATCH_PER_TICK" ]; then
                echo "$WF overdue (${AGE}m) but the dispatch cap is spent — next tick"
                continue
              fi
              echo "::warning::$WF is ${AGE}m old (limit ${MAXAGE}m) — dispatching"
              gh workflow run "$WF" --repo "$REPO" --ref main $EXTRA < /dev/null \
                && { SENT=$((SENT + 1)); echo "dispatched $WF"; } \
                || echo "::error::dispatch failed for $WF (next tick will retry)"
            done <<< "$OVERDUE"

            echo "tick ${TICK}: ${SENT} dispatch(es)"
            echo "::endgroup::"
            sleep "$TICK_SECONDS"
          done

      - name: Chain the next supervisor run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run watchdog-near-loops.yml --ref main --repo "${{ github.repository }}" \
            && echo "successor dispatched" || echo "dispatch failed; cron backstop will restart"
