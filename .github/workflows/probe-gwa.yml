name: Probe Golf With Access adapter

# Exercises the new golfwithaccess adapter against the live API from CI (the
# dev sandbox proxy 403s the host). Runs the real production fetch path for all
# 11 courses; a green run means the adapter is safe for the scrape tiers, which
# already include golfwithaccess (it is not in their --exclude list).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper/adapters/golfwithaccess.py"
      - "scripts/probe_gwa.py"
      - ".github/workflows/probe-gwa.yml"

permissions:
  contents: write

concurrency:
  group: probe-gwa
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt || pip install requests beautifulsoup4 lxml

      - name: Probe
        timeout-minutes: 15
        run: |
          mkdir -p probe-results
          python3 scripts/probe_gwa.py 2>&1 | tee probe.log

      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 60 probe.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results/gwa.json || exit 0
          git commit -m "Probe: Golf With Access adapter [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "could not push after 5 attempts"; exit 1
