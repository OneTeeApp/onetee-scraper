name: Scrape SuperSaaS via browser (0-6 hourly, 0-30 daily)

# SuperSaaS publishes public tee sheets, but the day view is JS-rendered (plain
# HTTP returns a shell with zero slots). A real Chromium loads
#   /schedule/<acct>/<sched>?year=Y&month=M&day=D&view=day
# and scrapes the open "new reservation" chips. Login is only needed to *book*.
# The plain scraper excludes supersaas, so this job solely owns those slugs.

on:
  schedule:
    # Split so the DEEP slots have their own cron STRINGS to match on — a
    # single "37 * * * *" makes every hour indistinguishable to
    # github.event.schedule. Three deep slots, 8h apart.
    - cron: "37 0,1,3,4,5,6,7,8,9,11,12,13,14,15,16,17,19,20,21,22,23 * * *"
    - cron: "37 2 * * *"
    - cron: "37 10 * * *"
    - cron: "37 18 * * *"
  workflow_dispatch:
    inputs:
      deep:
        description: "Scrape the full 0-30 day horizon"
        default: "no"
  push:
    branches: [main]
    paths:
      - "registry.json"
      - "scraper/browser_supersaas.py"
      - ".github/workflows/scrape-supersaas-browser.yml"

permissions:
  contents: read

concurrency:
  group: scrape-supersaas-browser
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + Chromium
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Scrape 3 days + push each to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
          VPS_ONLY: "1"
          ONETEE_API_URL: https://api.oneteeapp.com
          ONETEE_INGEST_TOKEN: ${{ secrets.VPS_INGEST_TOKEN }}
        run: |
          # Hourly runs cover days 0-6; the 10:xx UTC run (~4am Denver) and a
          # manual deep dispatch stretch to the full 30-day horizon. Browser
          # scrapes are too slow to loop at the near tier's cadence, so daily
          # is the far-tier freshness for these platforms.
          DEEP=no
          # WHY THIS MATCHES THE CRON STRING AND NOT THE CLOCK.
          #
          # This gate used to read:
          #     [ "$(date -u +%H)" = "10" ] && DEEP=yes
          # a wall-clock hour equality evaluated INSIDE the job, so it only held
          # if the runner reached this line during that UTC hour. GitHub delivers
          # scheduled events late under load and drops slots outright, and a
          # queued job can start an hour after its slot — so the deep sweep was
          # silently skipped whenever either happened, taking days 7-30 with it.
          # That exact bug cost ~8,000 golfwithaccess tee times on 2026-08-14.
          # github.event.schedule is the cron expression that FIRED, so delivery
          # jitter cannot move a run out of its slot.
          case "${{ github.event.schedule }}" in
            "37 2 * * *"|"37 10 * * *"|"37 18 * * *") DEEP=yes ;;
          esac
          [ "${{ github.event.inputs.deep }}" = "yes" ] && DEEP=yes
          LAST=6
          [ "$DEEP" = "yes" ] && LAST=30
          # Dates from scraper.dates (union of local todays across covered
          # timezones), not `date -u`: after ~5pm Mountain the UTC date is
          # already tomorrow and a UTC "today" skips the real one.
          for DATE in $(python -m scraper.dates --registry registry.json --days "$((LAST + 1))"); do
            OUT="output/ss_${DATE}.json"
            python -m scraper.browser_supersaas --date "${DATE}" --out "${OUT}" || true
            python -m scraper.d1 push --data "${OUT}" || true
          done
