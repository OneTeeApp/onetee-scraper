name: Scrape mid tier (days 3-7, hourly)

# Mid tier of the 30-day horizon: the near tier (scrape-near.yml) loops over
# days 0-2 every ~5 minutes, this scan covers days 3-7 hourly at :17, and
# scrape-far.yml covers 8-30 every two hours. On a push that changes the
# registry or the scraper it widens to days 0-7 so a course fix shows up
# everywhere near-term without waiting for each tier's own cadence. Sharded: the course list is split into N
# deterministic slices (--shard i/N) that run as parallel matrix jobs, so total
# wall-clock stays flat as the registry grows toward ~15k courses. Each shard
# only reads/writes its own courses in D1 (the sync is course-scoped), so shards
# never contend. Bump SHARDS by widening the matrix list — nothing else changes.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    # Only re-scan when the course list or scraper code changes — not on every
    # doc/workflow/probe commit (each was spawning a full 4-shard scan and
    # saturating the runners).
    paths:
      - "registry.json"
      - "scraper/**"
      - ".github/workflows/scrape.yml"

permissions:
  contents: read

# NOTE: matrix context is NOT available in workflow-level concurrency — using
# ${{ matrix.shard }} here made the whole workflow invalid (startup_failure on
# every trigger, cron included), which silently killed the full scan. A static
# group is also the right semantics: one full-scan RUN at a time (its 4 shard
# jobs still run in parallel inside the run).
concurrency:
  group: scrape-mid
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]   # N = 4 shards; widen this list to scale out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape + push shard ${{ matrix.shard }}/4 (mid tier)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
        run: |
          # Dates come from scraper/dates.py (union of local dates across the
          # timezones the registry covers), not `date -u`: after 18:00 MDT the
          # UTC date is already tomorrow, so a UTC-based window silently dropped
          # the real local today and left its evening slots stale in D1.
          # Scheduled runs cover days 3-7 (the near loop owns 0-2); a push that
          # changed the registry/scraper refreshes days 0-7 immediately.
          START=3; DAYS=5
          if [ "${{ github.event_name }}" = "push" ]; then START=0; DAYS=8; fi
          for DATE in $(python -m scraper.dates --registry registry.json --start ${START} --days ${DAYS}); do
            OUT="output/tee_times_${DATE}_s${{ matrix.shard }}.json"
            echo "::group::scrape+push ${DATE} shard ${{ matrix.shard }}"
            python -m scraper.aggregate --date "${DATE}" --workers 10 \
              --shard "${{ matrix.shard }}/4" \
              --exclude clubprophet,ezlinks,golfnow,clubcaddie,supersaas,totale \
              --out "${OUT}" || true
            python -m scraper.d1 push --data "${OUT}" || true
            echo "::endgroup::"
          done

      - name: Upload raw results as artifact (7-day debugging trail)
        uses: actions/upload-artifact@v4
        with:
          name: tee-times-${{ github.run_id }}-s${{ matrix.shard }}
          path: output/tee_times_*.json
          retention-days: 7
