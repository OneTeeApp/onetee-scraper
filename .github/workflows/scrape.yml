name: Scrape mid tier (days 3-7, hourly)

# Mid tier of the 30-day horizon: the near tier (scrape-near.yml) loops over
# days 0-2 every ~5 minutes, this scan covers days 3-7 hourly at :17, and
# scrape-far.yml covers 8-30 every two hours. On a push that changes the
# registry or the scraper it widens to days 0-7 so a course fix shows up
# everywhere near-term without waiting for each tier's own cadence. Sharded: the course list is split into N
# deterministic slices (--shard i/N) that run as parallel matrix jobs, so total
# wall-clock stays flat as the registry grows toward ~15k courses. Each shard
# only reads/writes its own courses in D1 (the sync is course-scoped), so shards
# never contend. Bump SHARDS by widening the matrix list — nothing else changes.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    # Only re-scan when the course list or scraper code changes — not on every
    # doc/workflow/probe commit (each was spawning a full 4-shard scan and
    # saturating the runners).
    paths:
      - "registry.json"
      - "scraper/**"
      - ".github/workflows/scrape.yml"

permissions:
  contents: read

# NOTE: matrix context is NOT available in workflow-level concurrency — using
# ${{ matrix.shard }} here made the whole workflow invalid (startup_failure on
# every trigger, cron included), which silently killed the full scan. A static
# group is also the right semantics: one full-scan RUN at a time (its 4 shard
# jobs still run in parallel inside the run).
concurrency:
  group: scrape-mid
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Was 25, which this job had silently outgrown. Measured in run #213 shard
    # 0: day 3 took 10m31s, day 4 took 13m18s, day 5 started at 10:08:22 and
    # was cancelled 78 seconds later. Two of five dates, every hour, for as
    # long as nobody looked — so days 5, 6 and 7 were not being scraped in ANY
    # state. It showed in the feed exactly as you would predict: Maryland
    # served 59 venues on day 3, 31 on day 4, then 16 and 14, while the far
    # tier held a steady 28 from day 8 out. A tier that covers the near half of
    # its window and abandons the rest reads, from outside, as "these courses
    # stop taking bookings after Tuesday".
    #
    # The clock was never the fault, though; the redundancy was. 353 of this
    # tier's 646 courses are TeeItUp and 330 of them have their own alias, and
    # every date re-fetched every alias's unchanging facility metadata from
    # scratch, because every date is its own process. The on-disk cache in
    # scraper/adapters/teeitup.py now shares that across the date loop, which
    # should bring a run to roughly 35 minutes. 50 is that plus room, and still
    # short enough that a wedged run frees the hour instead of eating it.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]   # N = 4 shards; widen this list to scale out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape + push shard ${{ matrix.shard }}/4 (mid tier)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DB_ID: ${{ secrets.CLOUDFLARE_D1_DB_ID }}
        run: |
          # Dates come from scraper/dates.py (union of local dates across the
          # timezones the registry covers), not `date -u`: after 18:00 MDT the
          # UTC date is already tomorrow, so a UTC-based window silently dropped
          # the real local today and left its evening slots stale in D1.
          # Scheduled runs cover days 3-7 (the near loop owns 0-2); a push that
          # changed the registry/scraper refreshes days 0-7 immediately.
          # teeitup is EXCLUDED here. Not a TLS throttle (probe-kenna-impersonate
          # proved plain==curl_cffi per-call) but a fleet RATE limit: kenna 429s
          # when many teeitup jobs hit it at once. To keep teeitup's kenna
          # traffic isolated and centrally paced, teeitup rides only its OWN two
          # jobs — scrape-teeitup-browser-near.yml (days 0-2, plain-HTTP loop)
          # and scrape-teeitup-browser.yml (days 3-30, browser, gentle) — and
          # NOT the shared near/mid/far plain tiers, which would contend on the
          # one kenna host with no cross-workflow pacing.
          START=3; DAYS=5
          if [ "${{ github.event_name }}" = "push" ]; then START=0; DAYS=8; fi
          mkdir -p output
          # Shuffled, for the same reason scrape-far.yml shuffles: a date loop
          # that always runs in order starves the SAME dates whenever the run
          # is short of budget, and starves them every single time. In order,
          # this tier fed days 3 and 4 and abandoned 5, 6 and 7 permanently.
          # Shuffled, a short run leaves a different gap each hour and the
          # union across a few runs still covers the window — so the failure
          # degrades into staleness instead of a wall the feed falls off.
          for DATE in $(python -m scraper.dates --registry registry.json --start ${START} --days ${DAYS} | shuf); do
            OUT="output/tee_times_${DATE}_s${{ matrix.shard }}.json"
            echo "::group::scrape+push ${DATE} shard ${{ matrix.shard }}"
            # A date only counts as done if BOTH the aggregate and the push
            # succeeded — the `|| OK=no` keeps a failed date from killing the
            # loop (same semantics `|| true` had) without letting it claim
            # coverage it never delivered.
            OK=yes
            python -m scraper.aggregate --date "${DATE}" --workers 10 \
              --shard "${{ matrix.shard }}/4" \
              --exclude clubprophet,ezlinks,golfnow,clubcaddie,supersaas,golfwithaccess,teeitup,totale,trutee \
              --out "${OUT}" || OK=no
            python -m scraper.d1 push --data "${OUT}" || OK=no
            [ "$OK" = "yes" ] && echo "${DATE}" >> output/.dates_done
            echo "::endgroup::"
          done

      # The whole reason this bug survived so long is that a cancelled step
      # leaves nothing behind saying what it did not get to — the artifact
      # upload below is skipped on cancellation too, so there was no trail at
      # all. `if: always()` runs this even when the job is being torn down, so
      # a truncated run says so in its own summary instead of looking like a
      # completed one that simply found less.
      - name: Which dates actually finished
        if: always()
        run: |
          START=3; DAYS=5
          [ "${{ github.event_name }}" = "push" ] && { START=0; DAYS=8; }
          WANT=$(python -m scraper.dates --registry registry.json --start ${START} --days ${DAYS} || true)
          DONE=$(cat output/.dates_done 2>/dev/null || true)
          MISSED=""
          for D in ${WANT}; do
            echo "${DONE}" | grep -qx "${D}" || MISSED="${MISSED} ${D}"
          done
          {
            echo "### mid tier shard ${{ matrix.shard }}/4"
            echo "covered: $(echo ${DONE} | wc -w) of $(echo ${WANT} | wc -w) date(s)"
            [ -n "${MISSED}" ] && echo ":warning: **never scraped:**${MISSED}"
            echo ""
          } >> $GITHUB_STEP_SUMMARY
          [ -n "${MISSED}" ] && echo "::warning::mid tier ran out of budget before${MISSED}"
          exit 0

      - name: Upload raw results as artifact (7-day debugging trail)
        uses: actions/upload-artifact@v4
        with:
          name: tee-times-${{ github.run_id }}-s${{ matrix.shard }}
          path: output/tee_times_*.json
          retention-days: 7
