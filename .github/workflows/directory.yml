name: Build + verify the course directory

# Regenerates directory.json (and the Worker's bundled copy) from the state
# CSVs, then checks it tells golfers the truth before it can ship.
#
# Separate from the state-status workflow on purpose. That one commits with
# [skip ci], which is right for a report nobody deploys — but the directory
# lands in worker/directory.gen.js, and a commit there that never deploys
# would leave the API serving the previous directory indefinitely. Pushes made
# with GITHUB_TOKEN never trigger other workflows. That used to matter because
# this job dispatched deploy-worker.yml itself; both that workflow and the
# onetee-api Worker it deployed are gone since the VPS cutover, so a directory
# change now reaches the site only when someone updates the gate by hand.
#
# The verify step is the one that matters: it fails if a course we are
# actively selling tee times for is tagged "call the pro shop" or "members
# only". That is a lie to a golfer, and it is invisible from the inside.

on:
  push:
    branches: [main]
    paths:
      - "*_golf_courses_booking.csv"
      - "build_directory.py"
      - "scripts/verify_directory.py"
      - ".github/workflows/directory.yml"
  schedule:
    - cron: "17 14 * * *"        # after state-status, so it verifies fresh live data
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: directory
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `set -o pipefail` is load-bearing in both steps below, not style. A
      # step's exit status is the LAST command in the pipeline, so `cmd | tee`
      # reports tee's status — always 0 — and the failure vanishes. That is not
      # hypothetical: from the Florida import until 2026-07-30 verify_directory
      # exited 1 on every run (36 cards with no link, no phone and no recorded
      # reason) while this job stayed green and the Commit step below, guarded on
      # `steps.verify.outcome == 'success'`, ran every single time. The gate that
      # exists to stop the site contradicting the live feed had never once
      # blocked a publish. Same bug had made deploy-worker.yml permanently red
      # for the opposite reason; pipelines and exit codes are worth re-reading.
      # Rebuild registry.json in the workspace before verifying against it. The
      # committed copy is one workflow-run behind on a CSV push, because this job
      # and rebuild-registry.yml both trigger on the same commit and race: this
      # job checks out the registry built from the PREVIOUS CSV while
      # build_directory.py reads the new one. Any CSV edit that retires a
      # registry venue therefore fails verify's "registry venue with no card"
      # check exactly once, then passes on the next unrelated push — a gate that
      # cries wolf on a real change and is silent on the next one. It happened on
      # the first push that used it (c500aeb, the Maryland revision): five courses
      # retyped Closed were absent from the new directory and still present in the
      # old registry. Nothing is committed here; rebuild-registry.yml still owns
      # the file. This only makes the two sides of the comparison the same age.
      - name: Rebuild the registry so verify compares like with like
        run: |
          set -o pipefail
          python3 build_registry.py | tee /tmp/registry.log

      # ONETEE_* let build_directory.py read the VPS `venue_geo` table so every
      # venue carries lat/lng. Without them it falls back to the committed
      # local/venue_geo.json, and without that the fields are null — i.e. the
      # behaviour before coordinates existed. Never fatal.
      - name: Build
        env:
          ONETEE_API_URL: ${{ secrets.ONETEE_API_URL }}
          ONETEE_INGEST_TOKEN: ${{ secrets.ONETEE_INGEST_TOKEN }}
        run: |
          set -o pipefail
          python3 build_directory.py | tee directory.log

      # A silent Build failure would be worse than a loud one: verify would then
      # pass against the PREVIOUS directory.json still on disk and publish it.
      - name: Verify
        id: verify
        run: |
          set -o pipefail
          python3 scripts/verify_directory.py 2>&1 | tee -a directory.log

      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat directory.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Only publish a directory that passed. A verify failure means the file
      # on disk contradicts the live feed, and committing it would deploy that
      # contradiction to the site.
      # The rebuild above leaves registry.json modified in the workspace, and
      # Commit's "git pull --rebase" refuses to run with unstaged changes. Not a
      # guess: run 30509775412 burned all five push attempts on "cannot pull with
      # rebase: You have unstaged changes." Verify has already read the file, so
      # putting it back costs nothing. Same bug deploy-worker.yml had when its
      # "sed -i" left wrangler.toml dirty — a step that dirties a tracked file
      # breaks every later step that rebases, however unrelated it looks.
      - name: Put registry.json back (rebuild-registry.yml owns the committed copy)
        if: always()
        run: git checkout -- registry.json

      - name: Commit
        id: commit
        if: steps.verify.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add directory.json worker/directory.gen.js
          # local/venue_geo.json is only rewritten when the VPS answered and
          # returned rows. A run with no creds, or one that hit a VPS blip and
          # fell back to the cache, leaves it absent or unchanged — and `git
          # add` on a path that does not exist is a hard error under `bash -e`,
          # which would fail this step for a reason that has nothing to do with
          # the directory. Hence the guard rather than a fourth pathspec above.
          if [ -f local/venue_geo.json ]; then git add local/venue_geo.json; fi
          git diff --cached --quiet && { echo "directory unchanged"; exit 0; }
          git commit -m "Rebuild course directory from the state CSVs"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push \
              && { echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; }
            sleep $((i * 5))
          done
          echo "could not push the directory after 5 attempts"; exit 1

      # There is deliberately no deploy step. The `onetee-api` Worker was
      # deleted in the 2026-08-11 VPS cutover along with D1, and
      # deploy-worker.yml went with it — dispatching a workflow that no longer
      # exists would fail this job on every run that pushes.
      #
      # worker/directory.gen.js is still generated and committed. Nothing serves
      # it today: /api/directory now comes from the gate's own embedded copy,
      # and the gate can only be updated by pasting into the Cloudflare
      # dashboard. The file is the artefact that paste would come from, so it is
      # kept current rather than left to rot. Publishing a directory change to
      # the site is, for now, a manual step.
