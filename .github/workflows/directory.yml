name: Build + verify the course directory

# Regenerates directory.json (and the Worker's bundled copy) from the state
# CSVs, then checks it tells golfers the truth before it can ship.
#
# Separate from the state-status workflow on purpose. That one commits with
# [skip ci], which is right for a report nobody deploys — but the directory
# lands in worker/directory.gen.js, and a [skip ci] commit there would update
# the file without ever deploying it, leaving the API serving the previous
# directory indefinitely. This workflow commits normally so the existing
# worker/** trigger on deploy-worker picks the change up.
#
# The verify step is the one that matters: it fails if a course we are
# actively selling tee times for is tagged "call the pro shop" or "members
# only". That is a lie to a golfer, and it is invisible from the inside.

on:
  push:
    branches: [main]
    paths:
      - "*_golf_courses_booking.csv"
      - "build_directory.py"
      - "scripts/verify_directory.py"
      - ".github/workflows/directory.yml"
  schedule:
    - cron: "17 14 * * *"        # after state-status, so it verifies fresh live data
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: directory
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `set -o pipefail` is load-bearing in both steps below, not style. A
      # step's exit status is the LAST command in the pipeline, so `cmd | tee`
      # reports tee's status — always 0 — and the failure vanishes. That is not
      # hypothetical: from the Florida import until 2026-07-30 verify_directory
      # exited 1 on every run (36 cards with no link, no phone and no recorded
      # reason) while this job stayed green and the Commit step below, guarded on
      # `steps.verify.outcome == 'success'`, ran every single time. The gate that
      # exists to stop the site contradicting the live feed had never once
      # blocked a publish. Same bug had made deploy-worker.yml permanently red
      # for the opposite reason; pipelines and exit codes are worth re-reading.
      # Rebuild registry.json in the workspace before verifying against it. The
      # committed copy is one workflow-run behind on a CSV push, because this job
      # and rebuild-registry.yml both trigger on the same commit and race: this
      # job checks out the registry built from the PREVIOUS CSV while
      # build_directory.py reads the new one. Any CSV edit that retires a
      # registry venue therefore fails verify's "registry venue with no card"
      # check exactly once, then passes on the next unrelated push — a gate that
      # cries wolf on a real change and is silent on the next one. It happened on
      # the first push that used it (c500aeb, the Maryland revision): five courses
      # retyped Closed were absent from the new directory and still present in the
      # old registry. Nothing is committed here; rebuild-registry.yml still owns
      # the file. This only makes the two sides of the comparison the same age.
      - name: Rebuild the registry so verify compares like with like
        run: |
          set -o pipefail
          python3 build_registry.py | tee registry.log

      - name: Build
        run: |
          set -o pipefail
          python3 build_directory.py | tee directory.log

      # A silent Build failure would be worse than a loud one: verify would then
      # pass against the PREVIOUS directory.json still on disk and publish it.
      - name: Verify
        id: verify
        run: |
          set -o pipefail
          python3 scripts/verify_directory.py 2>&1 | tee -a directory.log

      - name: Summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat directory.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Only publish a directory that passed. A verify failure means the file
      # on disk contradicts the live feed, and committing it would deploy that
      # contradiction to the site.
      - name: Commit
        if: steps.verify.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add directory.json worker/directory.gen.js
          git diff --cached --quiet && { echo "directory unchanged"; exit 0; }
          git commit -m "Rebuild course directory from the state CSVs"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "could not push the directory after 5 attempts"; exit 1
